[workspace]
resolver = "3"
members = ["crates/*", "sdk/aegis-sdk", "xtask", "subjects/*"]
exclude = ["oracles", "research", "conformance", "bench", "profiles"]
default-members = ["crates/*", "sdk/aegis-sdk"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

# Pin rule (REPO_LAYOUT §1): caret ranges + security floors here; the golden Cargo.lock targets are
# enforced by `xtask lock-targets`. Exact `=` pins live only in profiles/cmvp/.
[workspace.dependencies]
aegis-adapter-host = { path = "crates/aegis-adapter-host" }
aegis-adapter-pg = { path = "crates/aegis-adapter-pg" }
aegis-adapter-redis = { path = "crates/aegis-adapter-redis" }
aegis-adapter-sqlite = { path = "crates/aegis-adapter-sqlite" }
aegis-admission = { path = "crates/aegis-admission" }
aegis-agent = { path = "crates/aegis-agent" }
aegis-audit = { path = "crates/aegis-audit" }
aegis-authz = { path = "crates/aegis-authz" }
aegis-budget = { path = "crates/aegis-budget" }
aegis-canon = { path = "crates/aegis-canon" }
aegis-config = { path = "crates/aegis-config" }
aegis-data-ir = { path = "crates/aegis-data-ir" }
aegis-egress = { path = "crates/aegis-egress" }
aegis-iso = { path = "crates/aegis-iso" }
aegis-metrics = { path = "crates/aegis-metrics" }
aegis-ops = { path = "crates/aegis-ops" }
aegis-state = { path = "crates/aegis-state" }
aegis-tls = { path = "crates/aegis-tls" }
aegis-token = { path = "crates/aegis-token" }
aegis-transport = { path = "crates/aegis-transport" }
aegis-types = { path = "crates/aegis-types" }
aegis-wasm = { path = "crates/aegis-wasm" }
aegis-sdk = { path = "sdk/aegis-sdk" }

# Third-party floors (REPO_LAYOUT §1). Lock targets: supply-chain/lock-targets.toml. 7-day cooldown via
# `cargo xtask lock-age`; security bypasses only through supply-chain/exceptions.toml.
tokio = { version = "1.53.3", default-features = false }   # target 1.54.1 once ≥7 d old (2026-10-28)
hyper = { version = "1.12.0", default-features = false }
h2 = { version = "0.4.20", default-features = false }
http = { version = "1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-webpki = { version = "0.103.16", default-features = false }   # security floor (RUSTSEC-2026-0382); cooldown bypass ledgered
tokio-rustls = { version = "0.26.6", default-features = false }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
nix = { version = "0.31.3", default-features = false }   # fd passing (SCM_RIGHTS), sockopts, signals: aegis-ops / aegis-iso only
sd-notify = { version = "0.5.0", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "net"] }   # safe SCM_RIGHTS (OwnedFd) for F11

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
panic = "abort"
