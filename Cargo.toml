[workspace]
resolver = "3"
members = ["crates/*", "sdk/aegis-sdk", "xtask", "subjects/*", "apps/*"]
exclude = ["oracles", "research", "conformance", "bench", "profiles"]
default-members = ["crates/*", "sdk/aegis-sdk"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

# Pin rule (REPO_LAYOUT §1): caret ranges + security floors here; the golden Cargo.lock targets are
# enforced by `xtask lock-targets`. Exact `=` pins live only in profiles/cmvp/.
[workspace.dependencies]
aegis-adapter-host = { path = "crates/aegis-adapter-host" }
aegis-adapter-pg = { path = "crates/aegis-adapter-pg" }
aegis-adapter-redis = { path = "crates/aegis-adapter-redis" }
aegis-adapter-sqlite = { path = "crates/aegis-adapter-sqlite" }
aegis-admission = { path = "crates/aegis-admission" }
aegis-agent = { path = "crates/aegis-agent" }
aegis-audit = { path = "crates/aegis-audit" }
aegis-authz = { path = "crates/aegis-authz" }
aegis-budget = { path = "crates/aegis-budget" }
aegis-canon = { path = "crates/aegis-canon" }
aegis-config = { path = "crates/aegis-config" }
aegis-data-ir = { path = "crates/aegis-data-ir" }
aegis-egress = { path = "crates/aegis-egress" }
aegis-iso = { path = "crates/aegis-iso" }
aegis-metrics = { path = "crates/aegis-metrics" }
aegis-ops = { path = "crates/aegis-ops" }
aegis-p2 = { path = "crates/aegis-p2" }
aegis-state = { path = "crates/aegis-state" }
aegis-tls = { path = "crates/aegis-tls" }
aegis-token = { path = "crates/aegis-token" }
aegis-transport = { path = "crates/aegis-transport" }
aegis-types = { path = "crates/aegis-types" }
aegis-wasm = { path = "crates/aegis-wasm" }
aegis-sdk = { path = "sdk/aegis-sdk" }

# Third-party floors (REPO_LAYOUT §1). Lock targets: supply-chain/lock-targets.toml. 7-day cooldown via
# `cargo xtask lock-age`; security bypasses only through supply-chain/exceptions.toml.
tokio = { version = "1.53.3", default-features = false }   # target 1.54.1 once ≥7 d old (2026-10-28)
hyper = { version = "1.12.0", default-features = false }
h2 = { version = "0.4.20", default-features = false }
http = { version = "1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-webpki = { version = "0.103.16", default-features = false }   # security floor (RUSTSEC-2026-0382); cooldown bypass ledgered
tokio-rustls = { version = "0.26.6", default-features = false }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
sd-notify = { version = "0.5.0", default-features = false }
cedar-policy = { version = "4.14.0", default-features = false }   # aegis-pdp only (X-8: out of process); 4.14 is the GHSA-m84h floor
rustix = { version = "1.1.5", default-features = false, features = ["std", "net"] }   # safe SCM_RIGHTS (OwnedFd) for F11
# Embedded SQL store and SQLite adapter (aegis-state, aegis-adapter-sqlite). Bundled C SQLite: lock target
# libsqlite3-sys 0.38.2 = SQLite 3.53.2 (golden floor >= 3.51.3; crash-harness pin). Trusted, not verified C (D3).
# No default features: no hashlink statement cache (3 fewer crates); prepare per statement.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# P2 isolation (PLAN-5 D3/D11, DEVIATIONS X-13): wasmtime links ONLY into the aegis-p2 worker binary (through
# aegis-wasm), never into aegis-bin (gate no-wasmtime-in-bin). Exactly these four features (R-ISO-2): no
# component-model, gc, threads, winch, wasi. Security floor 50.0.1 (RUSTSEC-2026-0422/0423/0424 affect 50.0.0; the
# R-ISO-2 floor was >= 49.0.4, GHSA-897f). 50.0.1 needs cranelift ^0.137.1; both are 2 days old on 2026-10-31, so the
# cooldown is bypassed through supply-chain/exceptions.toml (PLAN-5 D11) until they pass it on 2026-11-05.
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "pooling-allocator", "runtime", "std"] }
# SHA-256 of the .cwasm, checked in aegis-wasm before the one unsafe deserialize (PLAN-5 D4). Already in the aegis-p2
# graph through cranelift-codegen, so no new crate; never in aegis-bin.
sha2 = { version = "0.10.9", default-features = false }
# aegis-iso raw syscalls (fork, prctl, seccomp, landlock_*, setitimer, _exit; PLAN-5 D4). Already in the lock and
# in the default aegis-bin build (tokio/rustix); a root pin only, no new crate.
libc = { version = "0.2.191", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(aegis_kani_negative)"] }
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
panic = "abort"
# Line tables only (backtraces keep file:line): full debuginfo made target/debug 3.5 GB on a 98%-full disk.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
