# Monban fuzz harness (unit P3-fuzz-001). A SEPARATE cargo workspace: it is not a member of the root workspace,
# has its own Cargo.lock, and nothing in the shipped graph depends on it (`cargo tree -p monban-bin` is unchanged).
# Built only with the pinned nightly + cargo-fuzz in the LAN box's isolated toolchain (ci/tools.lock, ci/fuzz.sh).
#
# Targets exercise public APIs only. Skipped: none (all 9 unit targets; mcp_gate since monban-agent landed in P3-agent-001).
# Phase 7 (P7-spec-002): proxy_v2 and client_hello_peek over monban-wire, registered as stubs; P7-wire-001 fills them.
# Phase 8 (P8-spec-002): pg_message over monban-adapter-pg's backend codec, registered as a stub; P8-hardening-001
# fills it. monban-adapter-pg brings aws-lc-rs (already here via monban-token) and rustix: both root-lock versions.
[package]
name = "monban-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
# Exact pin, published >= 7 days before it was added (2026-10-29). `arbitrary` (locked 1.5.0, 2026-10-06) comes
# through its re-export. Every other locked crate is the version in the root Cargo.lock.
libfuzzer-sys = "=0.4.13"
monban-types = { path = "../crates/monban-types" }
monban-transport = { path = "../crates/monban-transport" }
monban-token = { path = "../crates/monban-token" }
monban-canon = { path = "../crates/monban-canon" }
monban-authz = { path = "../crates/monban-authz" }
monban-config = { path = "../crates/monban-config" }
monban-audit = { path = "../crates/monban-audit" }
monban-egress = { path = "../crates/monban-egress" }
monban-agent = { path = "../crates/monban-agent" }
monban-wire = { path = "../crates/monban-wire" }
monban-adapter-pg = { path = "../crates/monban-adapter-pg" }
tokio = { version = "1.53.3", default-features = false, features = ["io-util"] }

[lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set by cargo-fuzz; `fuzzing_selftest` only by `ci/fuzz.sh self-test` (planted panics, never shipped).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(fuzzing_selftest)"] }

[profile.release]
debug = 1
panic = "abort"

[[bin]]
name = "h1_head"
path = "fuzz_targets/h1_head.rs"
test = false
doc = false
bench = false

