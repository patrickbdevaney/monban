expect_group = "SECP256R1MLKEM768"
requires = "cmvp"
witnesses = ["P-PQ2", "Select", "P-PQ5"]
note = "Both hybrid shares offered: the FIPS listener takes 0x11EB even though the client listed 0x11EC first."

# Phase 6 government profiles (2026-11-04, P6-spec-001; spec-authored from PLAN-6 F12 and rustls 0.23.46 server/hs.rs,
# not from research probes). requires = "floor": 0x11ED is aegis-tls code and MLKEM1024 / ML-DSA-87 are in the floor lock.

[[verdict]]
id = "UNI-T1"
source = "P6-spec-001 (PLAN-6 F12)"
profile = "P-UNIVERSAL"
offer_groups = ["X25519MLKEM768", "SECP384R1MLKEM1024"]
offer_key_shares = ["X25519MLKEM768", "SECP384R1MLKEM1024"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65", "mldsa87"]
expect = "server_hello"
expect_group = "SECP384R1MLKEM1024"
requires = "floor"
witnesses = ["Select", "P-PQ2", "universal_only_11ED"]
note = "0x11ED offered with a share: one round trip on 0x11ED. The client lists 0x11EC first; it is not in the profile, so the client-order pick is 0x11ED."

[[verdict]]
id = "UNI-T2"
source = "P6-spec-001 (PLAN-6 F12)"
profile = "P-UNIVERSAL"
offer_groups = ["X25519MLKEM768", "SECP256R1MLKEM768", "SECP384R1MLKEM1024"]
offer_key_shares = ["X25519MLKEM768", "SECP256R1MLKEM768"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65", "mldsa87"]
expect = "hrr"
expect_group = "SECP384R1MLKEM1024"
requires = "floor"
witnesses = ["Select", "P-PQ2", "hrr_only_if_no_share", "universal_only_11ED"]
note = "Shares only for 0x11EC/0x11EB (both outside the profile), 0x11ED listed in supported_groups without a share: retry to 0x11ED, never accept a share outside the profile."

[[verdict]]
id = "UNI-T3"
source = "P6-spec-001 (PLAN-6 F12)"
profile = "P-UNIVERSAL"
