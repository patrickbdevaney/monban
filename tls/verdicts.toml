# --------------------------------------------------------------------------------------------- supplementary
# Checked by the oracle on every run, cited by id, but NOT part of the 12 frozen verdicts. mode = "probe" is a raw
# ClientHello like the verdicts; mode = "full" is a complete in-memory handshake with a real rustls client whose
# kx_groups = client_groups (the client chooses its own key shares); the oracle observes the negotiated group,
# the handshake kind and the server's CertificateVerify scheme (checked against the profile's sigalgs, P-PQ2).

[[supplementary]]
id = "SUP-1"
source = "r3pq.hrr-acceptance-test T7"
mode = "full"
profile = "PQ-REQUIRED"
client_groups = ["X25519", "X25519MLKEM768"]
expect_group = "X25519MLKEM768"
expect_kind = "FullWithHelloRetryRequest"
witnesses = ["P-PQ1", "P-PQ2"]

