# AEGIS frozen interface F12: TLS handshake verdicts + per-profile key-exchange / signature lists.
#
# Spec: spec/SPEC_INVARIANTS.md section F (P-PQ1..P-PQ6, Select(model)); ARCHITECTURE.md section 3.2.
# Checked by: oracles/hrr-verdicts  (`oracles/hrr-verdicts/run --file tls/verdicts.toml` -> HRR-VERDICTS: PASS iff diff == 0).
#
# Freeze rule: any change to a [[verdict]] row (offer, profile, expected outcome) blocks a rustls / aws-lc-rs /
# aws-lc-fips-sys bump until reviewed by the spec author (implementers are read-only on this file). Other files
# cite verdict ids (PUB-T1..PUB-T6, FIPS-F1..FIPS-F6, UNI-T1..UNI-T5, BSI-T1..BSI-T4, CNSA-T1..CNSA-T4), never a count.
#
# Amendment 2026-11-04 (Phase 6, unit P6-spec-001, PLAN-6 "Interfaces" F12; re-frozen in the same commit):
#   - P-UNIVERSAL, P-BSI-ALT and P-CNSA: status pending -> active; new frozen verdicts UNI-T1..T5, BSI-T1..T4,
#     CNSA-T1..T4. PUB-T1..T6 and FIPS-F1..F6 are byte-identical.
#   - P-PUBLIC-WEB: 0x11ED (SECP384R1MLKEM1024) goes from kx_groups_target to kx_groups (aegis-tls::kx, Phase 6).
#   - New row vocabulary (offer_versions, profile sigalg_cover) and the Select model's admission steps, defined
#     below under "Row vocabulary added 2026-11-04". The oracle (P6-oracle-hrr-001) implements them.
#   - UNI-T5 and CNSA-T3 freeze alert 49, not the 40 in the PLAN-6 draft: see "Admission order" below.
#
# Amendment 2026-11-04 (Phase 6, unit P6-cmvp-002, PLAN-6 D17; re-frozen in the same commit):
#   - [profiles.P-CNSA] gains `requires = "floor"` and `cmvp = "refused"` (fields defined under "Profile fields
#     added by D17" below). Reason: ML-DSA-87 is not in the AWS-LC FIPS 3.1.0 module (aws-lc-rs 1.15.3 compiles
#     ML-DSA out under `fips`, PLAN-6 D15), so the cmvp build cannot serve P-CNSA and refuses it at boot.
#   - No [[verdict]] row changes: CNSA-T1..T4 stay byte-identical and are judged on the floor build only.
#
# Provenance (research, untrusted, re-run in-repo by the oracle):
#   PUB-T1..T6  = r3pq.hrr-acceptance-test, research/state/raw/round-003/03-work/run1.txt (T1..T6) and
#                 hrr_acceptance_test.rs; executed 2026-10-25 on rustls 0.23.46 + aws-lc-rs 1.18.2.
#   FIPS-F1..F6 = r4tri.fips-handshake-verdicts, research/state/raw/round-004/03-work-probe_fips_0.13.11.txt
#                 (PROBE 3, 4, 1, 2, 7, 8 in that order); executed on rustls 0.23.43 + aws-lc-rs 1.15.3 +
#                 aws-lc-fips-sys 0.13.11 (AWS-LC FIPS 3.1.0) and reported identical on 0.23.46 + FIPS 4.2.0.
#                 The research did not number them; the F-numbering below is assigned here and is now frozen.
#
# Value conventions:
#   groups / sigalgs are names from [codepoints.*]; the oracle sends the codepoints on the wire.
#   expect = "hrr"          -> server's first reply is a HelloRetryRequest whose key_share selects expect_group
#   expect = "server_hello" -> a ServerHello whose key_share is expect_group (handshake proceeds)
#   expect = "alert"        -> a fatal alert with description expect_alert (40 = handshake_failure)
#   requires = "floor"      -> fully checkable on the floor lock (rustls 0.23.46 + aws-lc-rs 1.18.2, no FIPS module)
#   requires = "cmvp"       -> group selection is checked on the floor lock (selection is rustls code, not module
#                              code); the module half (config.fips() == true, module identity AWS-LC FIPS 3.1.0,
#                              P-PQ5) needs the profiles/cmvp build and is reported SKIPPED until that build exists.
#
# Profile fields added by D17 (2026-11-04, P6-cmvp-002):
#   requires        (optional, [profiles.*]) only value "floor": the profile's selection, admission, P-PQ1/P-PQ2
#                   and verdict checks are judged on the floor build (root lock) only. Absent = no restriction.
#   cmvp            (optional, [profiles.*]) only value "refused"; needs requires = "floor" (load error otherwise).
#                   The cmvp build must refuse to build this profile. With --require-cmvp the oracle replaces every
#                   check of the profile (static, behavioural, its [[verdict]] and [[supplementary]] rows) by one
#                   check: `describe` of the profile exits non-zero with a reason, and `serve` of it answers a
#                   hello for the profile's first group with neither a ServerHello nor a HelloRetryRequest. A cmvp
#                   subject that serves the profile is a FAIL. Without --require-cmvp the field changes nothing.
#
# Row vocabulary added 2026-11-04 (oracle field definitions; precise, so the oracle can implement them):
#   offer_versions  (optional, [[verdict]] and mode = "probe" [[supplementary]] rows) array of version names from
#                   {"TLS13", "TLS12"}, no duplicates, non-empty. Absent = ["TLS13"] (every row before 2026-11-04,
#                   whose wire bytes are therefore unchanged). On the wire: the supported_versions extension
#                   (0x002b) lists exactly these, in row order, TLS13 = 0x0304, TLS12 = 0x0303. legacy_version stays
#                   0x0303 and cipher_suites stay [client_hello].cipher_suites; nothing else in the hello changes.
#                   A row whose model outcome would negotiate TLS 1.2 (offer_versions without TLS13 against a profile
#                   whose versions contain TLS12) is a load error: every profile is TLS 1.3 only (P-PQ4) and the
#                   model does not cover TLS 1.2 negotiation.
#   sigalg_cover    (optional, [profiles.*]) only value "all-or-none". Load-time check for every [[verdict]] and
#                   mode = "probe" [[supplementary]] row on that profile: offer_sigalgs intersected with the
#                   profile's sigalgs is either empty or equal to the profile's sigalgs; otherwise a load error.
#                   Reason: these profiles allow more than one credential (ML-DSA-87 / ECDSA-P384), so a row offering
#                   only part of the set would make the outcome depend on which credential the subject serves.
#                   Under the rule the model's sigalg step is exact for any in-profile credential.
#   expect_alert    unchanged meaning; new values used: 49 (access_denied), 70 (protocol_version).
#
# Select model as the oracle's MODEL check applies it (spec section F Select(model); SPEC_INVARIANTS section F
# addendum 2026-11-04). For profile P and row c, the first server record is, in this order:
#   1. version admission: if offer_versions and P.versions are disjoint            -> alert 70 (protocol_version)
#   2. sigalg admission:  if offer_sigalgs and P.sigalgs are disjoint               -> alert 49 (access_denied)
#   3. group selection:   Lean AegisIR.Select.select(P.kx, P.selector, c.groups, c.shares):
#        selected = first group in c.groups that is in P.kx (client-order; server-order: first of P.kx in c.groups)
#        none -> alert 40; selected in c.key_shares -> server_hello(selected); else -> hrr(selected)
# Steps 1-2 are admission checks outside the Lean model (which is step 3 only); on the rows before 2026-11-04 they
# never fire, so the model is unchanged for PUB-T1..T6, FIPS-F1..F6 and SUP-3/SUP-4.
#
# Admission order (why 70 and 49, read from rustls 0.23.46 src/server/hs.rs, ExpectClientHello::with_certified_key):
#   the supported_versions check runs first and sends ProtocolVersion (70) when the client offers no enabled
#   version; the certificate resolver runs next, before choose_suite_and_kx_group; aegis-tls wraps every
#   resolver in ProfileCertResolver, which returns None when no offered scheme is both allowed by the profile and
#   signable by the key, and rustls then sends AccessDenied (49) "no server certificate chain resolved". The group
#   check (NoKxGroupsInCommon -> 40) and HRR come after. A handshake_failure (40) for "no common signature scheme"
#   exists in rustls only in tls13 emit_certificate_verify, after the ServerHello has been sent, so it can never be
#   the first server record: freezing 40 for UNI-T5 / CNSA-T3 would freeze an unreachable verdict.

schema = "aegis.tls.verdicts/1"
interface = "F12"
frozen = "2026-10-25"

[codepoints.groups]
X25519MLKEM768 = 0x11EC
SECP256R1MLKEM768 = 0x11EB
SECP384R1MLKEM1024 = 0x11ED
X25519 = 0x001D
SECP256R1 = 0x0017
SECP384R1 = 0x0018
MLKEM768 = 0x0201
MLKEM1024 = 0x0202

[codepoints.sigalgs]
ecdsa_secp256r1_sha256 = 0x0403
ecdsa_secp384r1_sha384 = 0x0503
rsa_pss_rsae_sha256 = 0x0804
ed25519 = 0x0807
mldsa44 = 0x0904
mldsa65 = 0x0905
mldsa87 = 0x0906

# Fields of the hand-built ClientHello that the verdicts do not vary (same shape as the research probes:
# legacy_version 0x0303, supported_versions [TLS 1.3], one suite, null compression, SNI aegis.test).
[client_hello]
versions = ["TLS13"]
cipher_suites = [0x1301]
sni = "aegis.test"

# --------------------------------------------------------------------------------------------- profiles
# selector: "client-order" = rustls 0.23.x (server picks the first client-listed group it supports; HRR iff no
# share for it). "server-order" = after the PreferServerOrder (rustls main 28ee6c68) backport. Changing a profile's
# selector flips PUB-T2 and is a verdict-file change, not a config change.
# kx_groups is the exact ordered list the listener must be configured with (P-PQ2: configured set = profile; the
# order is asserted too because kx_groups[0] is a startup assertion, ARCHITECTURE 3.2).
# sigalgs is the set of CertificateVerify schemes the listener may produce (P-PQ2).
# status: "active" = checked now; "cmvp-pending" = selection checked now, module half pending the cmvp build;
#         "pending" = listed for F12 completeness, not yet buildable (reason in pending_reason).

[profiles.P-PUBLIC-WEB]
status = "active"
listener = "public browser listener"
selector = "client-order"
kx_groups = ["X25519MLKEM768", "SECP384R1MLKEM1024", "SECP256R1MLKEM768", "X25519", "SECP256R1"]
kx_note = "2026-11-04: kx_groups_target became kx_groups. SECP384R1MLKEM1024 (0x11ED) is not in rustls (PR #3293 closed unmerged); it is aegis-tls::kx::SecP384r1MlKem1024 (Phase 6: kx-kat, kx-interop, kani-kx)."
sigalgs = ["ecdsa_secp256r1_sha256"]
credential = "ECDSA-P256 (public WebPKI; CA/B SC-106 withdrawn)"
versions = ["TLS13"]
early_data = false
residual = "client-order: clients listing X25519 before hybrid, or offering only classical groups, negotiate classical (PUB-T2)."

[profiles.PQ-REQUIRED]
status = "active"
listener = "agent / API / internal listeners (pq-required)"
selector = "client-order"
kx_groups = ["X25519MLKEM768"]
sigalgs = ["ecdsa_secp256r1_sha256", "mldsa44"]
credential = "ML-DSA-44 on private hops, ECDSA-P256 where the agent/API listener is WebPKI-facing (oracle reference uses ML-DSA-44)"
versions = ["TLS13"]
early_data = false

[profiles.FIPS]
status = "cmvp-pending"
listener = "FIPS listener (R-PQC-2, invariant FIPS-KX-1)"
selector = "client-order"
kx_groups = ["SECP256R1MLKEM768", "SECP256R1", "SECP384R1"]
sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384"]
credential = "ECDSA-P256 (ML-DSA is in no CMVP certificate; X25519 is outside the 3.1.0 boundary)"
versions = ["TLS13"]
early_data = false
pending_reason = "config.fips() == true and module identity 'AWS-LC FIPS 3.1.0' need the cmvp lock (rustls =0.23.43, aws-lc-rs =1.15.3 [fips], aws-lc-fips-sys =0.13.11); CMVP #5298/#5314 tested OE is Amazon Linux 2023 only."

[profiles.FIPS-PQ-REQUIRED]
status = "cmvp-pending"
listener = "FIPS pq-required listener"
selector = "client-order"
kx_groups = ["SECP256R1MLKEM768"]
sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384"]
credential = "ECDSA-P256"
versions = ["TLS13"]
early_data = false
pending_reason = "as FIPS"

[profiles.P-UNIVERSAL]
status = "active"
listener = "government, multi-jurisdiction"
selector = "client-order"
kx_groups = ["SECP384R1MLKEM1024"]
sigalgs = ["mldsa87", "ecdsa_secp384r1_sha384"]
sigalg_cover = "all-or-none"
credential = "ML-DSA-87 or ECDSA-P384 (either is in profile; sigalg_cover makes the verdicts independent of which one the subject serves)"
versions = ["TLS13"]
early_data = false
kx_note = "0x11ED is AEGIS-owned (aegis-tls::kx, P-384 share first then ML-KEM-1024); activated 2026-11-04 with UNI-T1..T5. FIPS is not claimed for this profile until the 3.1.0 boundary check (ARCHITECTURE 3.2) passes."

[profiles.P-BSI-ALT]
status = "active"
listener = "government, BSI alternative"
selector = "client-order"
kx_groups = ["SECP384R1MLKEM1024", "SECP256R1MLKEM768"]
sigalgs = ["mldsa87", "ecdsa_secp384r1_sha384"]
sigalg_cover = "all-or-none"
credential = "ML-DSA-87 or ECDSA-P384 (as P-UNIVERSAL)"
versions = ["TLS13"]
early_data = false
kx_note = "activated 2026-11-04 with BSI-T1..T4. Client order: a client listing 0x11EB first gets 0x11EB (BSI-T1) until the PreferServerOrder backport."

[profiles.P-CNSA]
status = "active"
listener = "US NSS opt-in"
selector = "client-order"
kx_groups = ["MLKEM1024"]
sigalgs = ["mldsa87"]
sigalg_cover = "all-or-none"
credential = "ML-DSA-87"
requires = "floor"
cmvp = "refused"
versions = ["TLS13"]
early_data = false
kx_note = "activated 2026-11-04 with CNSA-T1..T4; buildable on the floor lock (rustls kx_group::MLKEM1024, ML-DSA-87). Pure ML-KEM is non-conformant in France (ANSSI-PG-083 v3.00): opt-in only."

# --------------------------------------------------------------------------------------------- verdicts (frozen)
# Offer sigalg sets:
#   research probe set = [ecdsa_secp256r1_sha256, rsa_pss_rsae_sha256, mldsa44, mldsa65]: every PUB/FIPS row, and the
#     sigalg-negative rows UNI-T5 and CNSA-T3 (it has neither mldsa87 nor ecdsa_secp384r1_sha384).
#   gov probe set (2026-11-04) = the research probe set plus ecdsa_secp384r1_sha384 and mldsa87: every other UNI/BSI/
#     CNSA row; it contains every sigalg of the three government profiles, so sigalg_cover holds.

[[verdict]]
id = "PUB-T1"
source = "r3pq.hrr-acceptance-test T1"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "X25519"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["Select", "P-PQ2"]
note = "RUSTSEC-2026-0349-poisoned client shape (lists hybrid first, sends only an X25519 share): server must retry to hybrid, never accept the classical share."

[[verdict]]
id = "PUB-T2"
source = "r3pq.hrr-acceptance-test T2"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519", "X25519MLKEM768"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "server_hello"
expect_group = "X25519"
requires = "floor"
witnesses = ["Select"]
note = "Documented residual under client-order selection (RFC 9846 permits it). Flips to hrr/X25519MLKEM768 only by a deliberate verdict change when the PreferServerOrder backport lands."

[[verdict]]
id = "PUB-T3"
source = "r3pq.hrr-acceptance-test T3"
profile = "PQ-REQUIRED"
offer_groups = ["X25519", "X25519MLKEM768"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["P-PQ1", "Select"]
note = "pq-required listener retries a classical-first client to hybrid."

[[verdict]]
id = "PUB-T4"
source = "r3pq.hrr-acceptance-test T4"
profile = "PQ-REQUIRED"
offer_groups = ["X25519"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "alert"
expect_alert = 40
requires = "floor"
witnesses = ["P-PQ1"]
note = "X25519-only client on a pq-required listener: handshake_failure (rustls PeerIncompatible::NoKxGroupsInCommon)."

[[verdict]]
id = "PUB-T5"
source = "r3pq.hrr-acceptance-test T5"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "SECP256R1"]
offer_key_shares = ["SECP256R1"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["Select", "P-PQ2"]
note = "Same as PUB-T1 with a P-256 share (needs a real P-256 point; a dummy share gives illegal_parameter 47)."

[[verdict]]
id = "PUB-T6"
source = "r3pq.hrr-acceptance-test T6"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "X25519"]
offer_key_shares = ["X25519MLKEM768"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "server_hello"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["Select", "P-PQ2"]
note = "Well-behaved hybrid client: one round trip, hybrid group."

[[verdict]]
id = "FIPS-F1"
source = "r4tri.fips-handshake-verdicts PROBE 3"
profile = "FIPS-PQ-REQUIRED"
offer_groups = ["SECP256R1", "SECP256R1MLKEM768"]
offer_key_shares = ["SECP256R1"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "SECP256R1MLKEM768"
requires = "cmvp"
witnesses = ["P-PQ1", "Select", "P-PQ5"]
note = "FIPS pq-required: classical-first client retried to SecP256r1MLKEM768."

[[verdict]]
id = "FIPS-F2"
source = "r4tri.fips-handshake-verdicts PROBE 4"
profile = "FIPS-PQ-REQUIRED"
offer_groups = ["SECP256R1"]
offer_key_shares = ["SECP256R1"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "alert"
expect_alert = 40
requires = "cmvp"
witnesses = ["P-PQ1", "P-PQ5"]
note = "FIPS pq-required: classical-only client refused."

[[verdict]]
id = "FIPS-F3"
source = "r4tri.fips-handshake-verdicts PROBE 1"
profile = "FIPS"
offer_groups = ["SECP256R1MLKEM768", "SECP256R1"]
offer_key_shares = ["SECP256R1"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "SECP256R1MLKEM768"
requires = "cmvp"
witnesses = ["Select", "P-PQ2", "P-PQ5"]
note = "FIPS listener: pq-first client with only a classical share is retried to hybrid. (Research label 'pq-pref'; server list is the 3-group FIPS list, not pq-required.)"

[[verdict]]
id = "FIPS-F4"
source = "r4tri.fips-handshake-verdicts PROBE 2"
profile = "FIPS"
offer_groups = ["SECP256R1MLKEM768", "SECP256R1"]
offer_key_shares = ["SECP256R1MLKEM768"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "server_hello"
expect_group = "SECP256R1MLKEM768"
requires = "cmvp"
witnesses = ["Select", "P-PQ2", "P-PQ5"]
note = "FIPS listener: hybrid share accepted in one round trip."

[[verdict]]
id = "FIPS-F5"
source = "r4tri.fips-handshake-verdicts PROBE 7"
profile = "FIPS"
offer_groups = ["X25519MLKEM768", "SECP256R1MLKEM768"]
offer_key_shares = ["X25519MLKEM768"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "SECP256R1MLKEM768"
requires = "cmvp"
witnesses = ["P-PQ2", "Select", "P-PQ5"]
note = "X25519MLKEM768 is not in the FIPS profile (the provider reports it fips=true, so only omission from kx_groups refuses it): retry to SecP256r1MLKEM768."

[[verdict]]
id = "FIPS-F6"
source = "r4tri.fips-handshake-verdicts PROBE 8"
profile = "FIPS"
offer_groups = ["X25519MLKEM768", "SECP256R1MLKEM768"]
offer_key_shares = ["X25519MLKEM768", "SECP256R1MLKEM768"]
