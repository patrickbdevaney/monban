# AEGIS frozen interface F12: TLS handshake verdicts + per-profile key-exchange / signature lists.
#
# Spec: spec/SPEC_INVARIANTS.md section F (P-PQ1..P-PQ6, Select(model)); ARCHITECTURE.md section 3.2.
# Checked by: oracles/hrr-verdicts  (`oracles/hrr-verdicts/run --file tls/verdicts.toml` -> HRR-VERDICTS: PASS iff diff == 0).
#
# Freeze rule: any change to a [[verdict]] row (offer, profile, expected outcome) blocks a rustls / aws-lc-rs /
# aws-lc-fips-sys bump until reviewed by the spec author (implementers are read-only on this file). Other files
# cite verdict ids (PUB-T1..PUB-T6, FIPS-F1..FIPS-F6), never a count.
#
# Provenance (research, untrusted, re-run in-repo by the oracle):
#   PUB-T1..T6  = r3pq.hrr-acceptance-test, research/state/raw/round-003/03-work/run1.txt (T1..T6) and
#                 hrr_acceptance_test.rs; executed 2026-10-25 on rustls 0.23.46 + aws-lc-rs 1.18.2.
#   FIPS-F1..F6 = r4tri.fips-handshake-verdicts, research/state/raw/round-004/03-work-probe_fips_0.13.11.txt
#                 (PROBE 3, 4, 1, 2, 7, 8 in that order); executed on rustls 0.23.43 + aws-lc-rs 1.15.3 +
#                 aws-lc-fips-sys 0.13.11 (AWS-LC FIPS 3.1.0) and reported identical on 0.23.46 + FIPS 4.2.0.
#                 The research did not number them; the F-numbering below is assigned here and is now frozen.
#
# Value conventions:
#   groups / sigalgs are names from [codepoints.*]; the oracle sends the codepoints on the wire.
#   expect = "hrr"          -> server's first reply is a HelloRetryRequest whose key_share selects expect_group
#   expect = "server_hello" -> a ServerHello whose key_share is expect_group (handshake proceeds)
#   expect = "alert"        -> a fatal alert with description expect_alert (40 = handshake_failure)
#   requires = "floor"      -> fully checkable on the floor lock (rustls 0.23.46 + aws-lc-rs 1.18.2, no FIPS module)
#   requires = "cmvp"       -> group selection is checked on the floor lock (selection is rustls code, not module
#                              code); the module half (config.fips() == true, module identity AWS-LC FIPS 3.1.0,
#                              P-PQ5) needs the profiles/cmvp build and is reported SKIPPED until that build exists.

schema = "aegis.tls.verdicts/1"
interface = "F12"
frozen = "2026-10-25"

[codepoints.groups]
X25519MLKEM768 = 0x11EC
SECP256R1MLKEM768 = 0x11EB
SECP384R1MLKEM1024 = 0x11ED
X25519 = 0x001D
SECP256R1 = 0x0017
SECP384R1 = 0x0018
MLKEM768 = 0x0201
MLKEM1024 = 0x0202

[codepoints.sigalgs]
ecdsa_secp256r1_sha256 = 0x0403
ecdsa_secp384r1_sha384 = 0x0503
rsa_pss_rsae_sha256 = 0x0804
ed25519 = 0x0807
mldsa44 = 0x0904
mldsa65 = 0x0905
mldsa87 = 0x0906

# Fields of the hand-built ClientHello that the verdicts do not vary (same shape as the research probes:
# legacy_version 0x0303, supported_versions [TLS 1.3], one suite, null compression, SNI aegis.test).
[client_hello]
versions = ["TLS13"]
cipher_suites = [0x1301]
sni = "aegis.test"

# --------------------------------------------------------------------------------------------- profiles
# selector: "client-order" = rustls 0.23.x (server picks the first client-listed group it supports; HRR iff no
# share for it). "server-order" = after the PreferServerOrder (rustls main 28ee6c68) backport. Changing a profile's
# selector flips PUB-T2 and is a verdict-file change, not a config change.
# kx_groups is the exact ordered list the listener must be configured with (P-PQ2: configured set = profile; the
# order is asserted too because kx_groups[0] is a startup assertion, ARCHITECTURE 3.2).
# sigalgs is the set of CertificateVerify schemes the listener may produce (P-PQ2).
# status: "active" = checked now; "cmvp-pending" = selection checked now, module half pending the cmvp build;
#         "pending" = listed for F12 completeness, not yet buildable (reason in pending_reason).

[profiles.P-PUBLIC-WEB]
status = "active"
listener = "public browser listener"
selector = "client-order"
kx_groups = ["X25519MLKEM768", "SECP256R1MLKEM768", "X25519", "SECP256R1"]
kx_groups_target = ["X25519MLKEM768", "SECP384R1MLKEM1024", "SECP256R1MLKEM768", "X25519", "SECP256R1"]
pending_reason = "SECP384R1MLKEM1024 (0x11ED) is not in rustls (PR #3293 closed unmerged); it is aegis-tls::kx::SecP384r1MlKem1024, Phase 6. Until then kx_groups = kx_groups_target minus 0x11ED."
sigalgs = ["ecdsa_secp256r1_sha256"]
credential = "ECDSA-P256 (public WebPKI; CA/B SC-106 withdrawn)"
versions = ["TLS13"]
early_data = false
residual = "client-order: clients listing X25519 before hybrid, or offering only classical groups, negotiate classical (PUB-T2)."

[profiles.PQ-REQUIRED]
status = "active"
listener = "agent / API / internal listeners (pq-required)"
selector = "client-order"
kx_groups = ["X25519MLKEM768"]
sigalgs = ["ecdsa_secp256r1_sha256", "mldsa44"]
credential = "ML-DSA-44 on private hops, ECDSA-P256 where the agent/API listener is WebPKI-facing (oracle reference uses ML-DSA-44)"
versions = ["TLS13"]
early_data = false

[profiles.FIPS]
status = "cmvp-pending"
listener = "FIPS listener (R-PQC-2, invariant FIPS-KX-1)"
selector = "client-order"
kx_groups = ["SECP256R1MLKEM768", "SECP256R1", "SECP384R1"]
sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384"]
credential = "ECDSA-P256 (ML-DSA is in no CMVP certificate; X25519 is outside the 3.1.0 boundary)"
versions = ["TLS13"]
early_data = false
pending_reason = "config.fips() == true and module identity 'AWS-LC FIPS 3.1.0' need the cmvp lock (rustls =0.23.43, aws-lc-rs =1.15.3 [fips], aws-lc-fips-sys =0.13.11); CMVP #5298/#5314 tested OE is Amazon Linux 2023 only."

[profiles.FIPS-PQ-REQUIRED]
status = "cmvp-pending"
listener = "FIPS pq-required listener"
selector = "client-order"
kx_groups = ["SECP256R1MLKEM768"]
sigalgs = ["ecdsa_secp256r1_sha256", "ecdsa_secp384r1_sha384"]
credential = "ECDSA-P256"
versions = ["TLS13"]
early_data = false
pending_reason = "as FIPS"

[profiles.P-UNIVERSAL]
status = "pending"
listener = "government, multi-jurisdiction"
selector = "client-order"
kx_groups = ["SECP384R1MLKEM1024"]
sigalgs = ["mldsa87", "ecdsa_secp384r1_sha384"]
versions = ["TLS13"]
early_data = false
pending_reason = "0x11ED is AEGIS-owned (Phase 6: KATs, OpenSSL 3.5+/BoringSSL interop, Kani share parsing). No F12 verdicts yet."

[profiles.P-BSI-ALT]
status = "pending"
listener = "government, BSI alternative"
selector = "client-order"
kx_groups = ["SECP384R1MLKEM1024", "SECP256R1MLKEM768"]
sigalgs = ["mldsa87", "ecdsa_secp384r1_sha384"]
versions = ["TLS13"]
early_data = false
pending_reason = "needs 0x11ED (Phase 6). No F12 verdicts yet."

[profiles.P-CNSA]
status = "pending"
listener = "US NSS opt-in"
selector = "client-order"
kx_groups = ["MLKEM1024"]
sigalgs = ["mldsa87"]
versions = ["TLS13"]
early_data = false
pending_reason = "buildable on the floor lock (kx_group::MLKEM1024, ML-DSA-87) but no F12 verdicts are frozen for it yet; pure ML-KEM is non-conformant in France (ANSSI-PG-083 v3.00)."

# --------------------------------------------------------------------------------------------- verdicts (12, frozen)
# All offers use sigalgs = [ecdsa_secp256r1_sha256, rsa_pss_rsae_sha256, mldsa44, mldsa65] (the research probe set).

[[verdict]]
id = "PUB-T1"
source = "r3pq.hrr-acceptance-test T1"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "X25519"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["Select", "P-PQ2"]
note = "RUSTSEC-2026-0349-poisoned client shape (lists hybrid first, sends only an X25519 share): server must retry to hybrid, never accept the classical share."

[[verdict]]
id = "PUB-T2"
source = "r3pq.hrr-acceptance-test T2"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519", "X25519MLKEM768"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "server_hello"
expect_group = "X25519"
requires = "floor"
witnesses = ["Select"]
note = "Documented residual under client-order selection (RFC 9846 permits it). Flips to hrr/X25519MLKEM768 only by a deliberate verdict change when the PreferServerOrder backport lands."

[[verdict]]
id = "PUB-T3"
source = "r3pq.hrr-acceptance-test T3"
profile = "PQ-REQUIRED"
offer_groups = ["X25519", "X25519MLKEM768"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["P-PQ1", "Select"]
note = "pq-required listener retries a classical-first client to hybrid."

[[verdict]]
id = "PUB-T4"
source = "r3pq.hrr-acceptance-test T4"
profile = "PQ-REQUIRED"
offer_groups = ["X25519"]
offer_key_shares = ["X25519"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "alert"
expect_alert = 40
requires = "floor"
witnesses = ["P-PQ1"]
note = "X25519-only client on a pq-required listener: handshake_failure (rustls PeerIncompatible::NoKxGroupsInCommon)."

[[verdict]]
id = "PUB-T5"
source = "r3pq.hrr-acceptance-test T5"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "SECP256R1"]
offer_key_shares = ["SECP256R1"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "hrr"
expect_group = "X25519MLKEM768"
requires = "floor"
witnesses = ["Select", "P-PQ2"]
note = "Same as PUB-T1 with a P-256 share (needs a real P-256 point; a dummy share gives illegal_parameter 47)."

[[verdict]]
id = "PUB-T6"
source = "r3pq.hrr-acceptance-test T6"
profile = "P-PUBLIC-WEB"
offer_groups = ["X25519MLKEM768", "X25519"]
offer_key_shares = ["X25519MLKEM768"]
offer_sigalgs = ["ecdsa_secp256r1_sha256", "rsa_pss_rsae_sha256", "mldsa44", "mldsa65"]
expect = "server_hello"
expect_group = "X25519MLKEM768"
requires = "floor"
