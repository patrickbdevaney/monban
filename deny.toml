# cargo-deny 0.20.2 policy (SUPPLY_CHAIN §A G1). Bans mirror REPO_LAYOUT §5.
[graph]
all-features = true
# Only the targets we ship; windows-only crates (windows-sys duplicates etc.) are never built.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []  # only via supply-chain/exceptions.toml entries, each with an expiry

[licenses]
allow = ["Apache-2.0", "MIT", "ISC", "BSD-3-Clause", "BSD-2-Clause", "Unicode-3.0", "Zlib", "OpenSSL",
         "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true  # first-party crates are publish = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true  # workspace path deps
deny = [
  { name = "fancy-regex", reason = "backtracking regex on the data plane (OPS: linear-time regex only)" },
  { name = "pcre2", reason = "C backtracking regex" },
  { name = "onig", reason = "C backtracking regex" },
  { name = "simd-json", reason = "banned JSON parser (duplicate-key/canonicality)" },
  { name = "sonic-rs", reason = "banned JSON parser" },
  { name = "bincode", reason = "banned codec (unmaintained; use postcard)" },
  { name = "wasmtime-wasi-http", reason = "egress only through aegis-egress fetch host fn" },
  { name = "openssl-sys", reason = "C TLS outside the aws-lc TCB line" },
  { name = "native-tls", reason = "C TLS outside the aws-lc TCB line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
