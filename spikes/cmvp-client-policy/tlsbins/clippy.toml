# fips_client_policy layer S (first-party source): only aegis-tls::pqclient may build a rustls ClientConfig.
disallowed-methods = [
  { path = "rustls::ClientConfig::builder", reason = "P-PQ6: use pqclient::pq_only_client_config" },
  { path = "rustls::ClientConfig::builder_with_provider", reason = "P-PQ6: use pqclient::pq_only_client_config" },
  { path = "rustls::ClientConfig::builder_with_protocol_versions", reason = "P-PQ6: use pqclient::pq_only_client_config" },
  { path = "rustls::client::Resumption::in_memory_sessions", reason = "P-PQ6: no client session / key-share-prediction store" },
  { path = "rustls::client::Resumption::store", reason = "P-PQ6: no client session / key-share-prediction store" },
]
disallowed-types = [
  { path = "rustls::client::ClientSessionMemoryCache", reason = "P-PQ6: no client session / key-share-prediction store" },
]
