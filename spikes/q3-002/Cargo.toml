# q3-002 IPC-hop spike: port of research/state/raw/round-003/02-bench (UDS/pipe + postcard frames only).
# Own workspace. Build only via ci/heavy.sh. Pins checked >=7 days old on 2026-10-25 (see README).
[package]
name = "ipchop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
libc = "=0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
