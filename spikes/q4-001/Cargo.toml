# q4-001 scratch workspace (standalone; not a member of the AEGIS workspace).
[workspace]
resolver = "2"
members = ["f7x", "corpus"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[workspace.dependencies]
# crates.io publish dates checked 2026-10-25: tokio 1.53.3 = 2026-10-13 (1.54.1 is 4 days old, rejected); trybuild 1.0.122 = 2026-10-07
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "macros", "sync", "time"] }
trybuild = "=1.0.122"
