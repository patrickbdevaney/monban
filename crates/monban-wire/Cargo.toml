[package]
name = "monban-wire"
description = "Pure wire parsers ahead of TLS/HTTP: PROXY protocol v2 header (F1 PROXY-1..3) and a bounded TLS ClientHello peek (SNI, ALPN, supported_versions, signature_algorithms, trust_anchors; F1 L4-1, SEL-1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Layer 2 (pure logic): no I/O, no allocation in the parse path, no third-party dependency (PREFLIGHT D-P7.2: our
# own parsers are less TCB than a crate and stay inside Kani's reach). Pre-wired by P7-spec-002; the parsers are
# P7-wire-001. Used by monban-tls (feature `mtc`) and monban-bin (features `proxy-protocol`, `l4`, `mtc`) only.
[package.metadata.monban]
layer = 2

