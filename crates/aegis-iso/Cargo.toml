[package]
name = "aegis-iso"
description = "Supervisor, exec-spawned zygote, Landlock+seccomp, cordons, fork+Wasm mode, crash budgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = 4

[dependencies]
aegis-types = { workspace = true }
# Raw syscalls for the sandbox and zygote (PLAN-5 D4/D5): <= 20 audited unsafe sites (cargo xtask unsafe-sites).
# Root pin; libc 0.2.191 is already in the lock and in the default aegis-bin build.
libc = { workspace = true }
# Safe fd passing (SCM_RIGHTS, OwnedFd) and process/prctl wrappers where rustix has them (fewer unsafe sites).
# `fs` and `process` are already enabled in the default aegis-bin build; `thread` (no_new_privs, dumpable) is a
# feature of the same crate, so no new crate.
rustix = { workspace = true, features = ["fs", "process", "thread"] }
# Feature `cmvp` only (PLAN-6 D16, module `fips`): orders the AWS-LC FIPS library that aws-lc-rs links under `fips`
# after this crate, so `awslc_version_string` resolves. Root pin, already in both locks: no new crate. (D16's
# literal option B, an optional aws-lc-fips-sys dependency, would add aws-lc-fips-sys 0.13.11 and 10 build crates
# to the ROOT lock, with RUSTSEC-2026-0042/0043 and no vet coverage: units/phase-6/reports/P6-cmvp-002.md.)
aws-lc-rs = { workspace = true, optional = true }

[features]
# PLAN-6 D16: `fips::awslc_version_string` (2 audited unsafe sites). Only with the cmvp overlay lock
# (profiles/cmvp/build.sh); on the floor lock the 0.13.11 symbol does not exist and a binary would not link.
cmvp = ["dep:aws-lc-rs"]
# PREFLIGHT D-P8.2 (P8-spec-002): `fips::with_indicator`, AWS-LC's FIPS 140-3 service indicator around one call
# (1 audited unsafe site: the extern block). Test subjects only (tls-subject `indicator`); never in aegis-bin:
# profiles/cmvp/build.sh builds aegis-bin in its own cargo invocation so feature unification cannot switch it on there.
indicator = ["cmvp"]
# Test-only code (syscall probe, layout report; PLAN-5 D15), enabled through aegis-p2 `test-hooks`. Never shipped.
test-hooks = []
# Oracle negative controls only (aegis-p2 `mutants`, aegis-bin `p2-mutants`, PLAN-5 D15). Never shipped.
mutants = []

# Equal to [workspace.lints] except unsafe_code = "deny" (not "forbid"): each audited site carries
# #[allow(unsafe_code)] plus a `// SAFETY:` comment; `cargo xtask unsafe-sites` caps them at 20 (DEVIATIONS X-14).
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(aegis_kani_negative)"] }
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
