[package]
name = "aegis-tls"
description = "TLS profiles, PQ key exchange (incl. our SecP384r1MLKEM1024), ticketer per scope, STEK ring (P-PQ1..6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = 3

[features]
default = []
# The rustls CLIENT profile builder (`client_config`, `assert_client_profile`). Off by default so the cmvp build
# compiles every rustls client out (spikes/cmvp-client-policy mode A, gate check M1 reads this crate's features).
tls-client = []
# PLAN-6 D1: the cmvp build (profiles/cmvp/build.sh: rustls =0.23.43, aws-lc-rs =1.15.3 + fips). Gates the code paths
# whose APIs those versions lack; the feature selects code only, the versions come from the overlay lock.
cmvp = []
# PLAN-6 (P6-tls-001): the deterministic-ephemeral KAT constructor of the 0x11ED key exchange. Tests and the kx-kat
# gate only; never part of a shipped build.
kat = []
# PLAN-6 D4 negative control ONLY (kx-interop, kx-kat self-tests): emits the 0x11ED share in the wrong component
# order (ML-KEM first). Never part of a shipped build.
order-mutant = []

[dependencies]
aegis-types = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
# Direct dependency only to hold the security floor (RUSTSEC-2026-0382) in this crate's resolve; rustls uses it.
rustls-webpki = { workspace = true }

[lints]
workspace = true
