[package]
name = "aegis-data-ir"
description = "Backend-agnostic Op IR, Pred, Adapter trait, check_schema, allowlist-lock format (lowering soundness)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = 2

[dependencies]
aegis-types = { workspace = true }
# Pre-wired by P4-spec-002 for the allowlist-lock `sha256` trailer (P4-datair-001): `aws_lc_rs::digest::SHA256`.
# Reuses the SHA-256 already in the shipped graph and the cmvp line instead of adding sha2 (+digest/block-buffer/
# crypto-common/generic-array/typenum/cpufeatures). Pure hashing, no IO.
aws-lc-rs = { workspace = true }

[lints]
workspace = true
