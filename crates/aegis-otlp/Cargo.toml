[package]
name = "aegis-otlp"
description = "Out-of-process OTLP/HTTP JSON exporter (PREFLIGHT D-P7.6): scrapes the admin OpenMetrics text, reads aegis JSON logs on stdin, POSTs /v1/metrics and /v1/logs. No OpenTelemetry crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Layer 5 (assembly), like aegis-pdp and aegis-p2: a separate binary. aegis-bin never depends on it (`cargo xtask
# layering` rejects any L5 -> L5 edge, and its self-test checks aegis-bin -> aegis-otlp goes red). Pre-wired by
# P7-spec-002; the exporter is P7-otlp-001. Gates: otlp-export, no-otel-in-bin.
[package.metadata.aegis]
layer = 5

[[bin]]
name = "aegis-otlp"
path = "src/main.rs"

[dependencies]
aegis-types = { workspace = true }
# JSON: the strict parser (log lines on stdin).
aegis-canon = { workspace = true }
# The hand-written HTTP/1.1 exchange (POST) and the rustls client handshake for https collectors. hyper's client
# needs `want`, `futures-channel` and `smallvec`, none of them in the lock, so the exporter reuses aegis-egress's
# exchange instead (as aegis-bin hand-writes its H1 upstream client).
aegis-egress = { workspace = true, features = ["tls-client"] }
# The rustls CLIENT profile builder (`client_config`).
aegis-tls = { workspace = true, features = ["tls-client"] }
# Root pins only, every crate already in Cargo.lock; no new crate. No tokio `macros` (tokio-macros is not in the lock).
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "sync"] }
rustls = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }

[lints]
workspace = true
