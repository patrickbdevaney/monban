[package]
name = "monban-pdp"
description = "Out-of-process Cedar PDP (DEVIATIONS X-8): validated policy set, PDP-1 wire over SOCK_SEQPACKET."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.monban]
layer = 5

[[bin]]
name = "monban-pdp"
path = "src/main.rs"

# Fault-injection driver for oracles/pdp-dst: the monban-authz PdpClient over the UDS transport (monban-adapter-host). No Cedar code is
# reachable from it (LTO drops the crate).
[[bin]]
name = "monban-pdp-probe"
path = "src/bin/monban-pdp-probe.rs"

[dependencies]
monban-types = { workspace = true }
monban-authz = { workspace = true }
# The PDP-1 SOCK_SEQPACKET plumbing (client transport + packet primitives) lives in the L4 host crate so monban-bin
# can use it without Cedar; re-exported here as `monban_pdp::uds`.
monban-adapter-host = { workspace = true }
# Root pin, default-features = false; no feature enabled: the PDP data model has no extension values (ipaddr,
# decimal, datetime), and nothing experimental (partial-eval, tpe, entity-manifest, protobufs) is used.
cedar-policy = { workspace = true }

[dev-dependencies]
# Root pin ("std", "net"): socketpair in the server tests; the socket plumbing itself is in monban-adapter-host.
# "time" only because rustix's linux_raw sockopt code does not compile without it (as in monban-ops).
rustix = { workspace = true, features = ["time"] }

[lints]
workspace = true
