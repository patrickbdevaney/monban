[package]
name = "monban-otlp"
description = "Out-of-process OTLP/HTTP JSON exporter (PREFLIGHT D-P7.6): scrapes the admin OpenMetrics text, reads monban JSON logs on stdin, POSTs /v1/metrics and /v1/logs. No OpenTelemetry crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Layer 5 (assembly), like monban-pdp and monban-p2: a separate binary. monban-bin never depends on it (`cargo xtask
# layering` rejects any L5 -> L5 edge, and its self-test checks monban-bin -> monban-otlp goes red). Pre-wired by
# P7-spec-002; the exporter is P7-otlp-001. Gates: otlp-export, no-otel-in-bin.
[package.metadata.monban]
layer = 5

[[bin]]
name = "monban-otlp"
path = "src/main.rs"

[dependencies]
monban-types = { workspace = true }
# JSON: the strict parser (log lines on stdin).
monban-canon = { workspace = true }
# The hand-written HTTP/1.1 exchange (POST) and the rustls client handshake for https collectors. hyper's client
# needs `want`, `futures-channel` and `smallvec`, none of them in the lock, so the exporter reuses monban-egress's
# exchange instead (as monban-bin hand-writes its H1 upstream client).
monban-egress = { workspace = true, features = ["tls-client"] }
# The rustls CLIENT profile builder (`client_config`).
monban-tls = { workspace = true, features = ["tls-client"] }
# Root pins only, every crate already in Cargo.lock; no new crate. No tokio `macros` (tokio-macros is not in the lock).
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "sync", "signal"] }
rustls = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }

[lints]
workspace = true
