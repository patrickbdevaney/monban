[package]
name = "aegis-audit"
description = "Tamper-evident audit log: C2SP tlog-tiles writer, single sequencer, signed checkpoints. Storage via the AuditSink trait (implemented in L4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = 3

[dependencies]
aegis-types = { workspace = true }
# SHA-256 (RFC 6962 hashing, signed-note key IDs), Ed25519 (log signature) and ML-DSA-87 (cosignature, stable
# `signature::ML_DSA_87*` API since aws-lc-rs 1.17).
aws-lc-rs = { workspace = true }

[lints]
workspace = true
