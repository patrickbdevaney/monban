[package]
name="hello"
version="0.1.0"
edition="2021"
[dependencies]
hyper={version="=1.12.0",default-features=false,features=["server","http1","http2"]}
hyper-util={version="=0.1.21",default-features=false,features=["tokio","server","http1","http2"]}
tokio={version="1",default-features=false,features=["rt","rt-multi-thread","net","macros"]}
tokio-rustls={version="=0.26.6",default-features=false,features=["aws-lc-rs"]}
rustls={version="=0.23.46",default-features=false,features=["aws-lc-rs","std","tls12"]}
rustls-pemfile="2"
http-body-util="0.1"
bytes="1"
h3={version="=0.0.8",optional=true}
h3-quinn={version="=0.0.10",optional=true}
quinn={version="0.11",optional=true,default-features=false,features=["rustls-aws-lc-rs","runtime-tokio"]}
wasmtime={version="=48.0.7",optional=true,default-features=false,features=["runtime","std"]}
libloading={version="0.8",optional=true}
[features]
h3=["dep:h3","dep:h3-quinn","dep:quinn"]
wasm=["dep:wasmtime"]
wasmjit=["dep:wasmtime","wasmtime/cranelift"]
dlopen=["dep:libloading"]
[profile.release]
opt-level=3
lto=true
codegen-units=1
panic="abort"
strip=true
