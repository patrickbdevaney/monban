worker_processes WP;
pid /tmp/nginx.pid;
events{worker_connections 4096;}
http{
 access_log off;
 server{listen 18080;location /{default_type text/plain;return 200 "hello aegis\n";}}
 server{listen 18443 ssl;http2 on;ssl_certificate /w/cert.pem;ssl_certificate_key /w/key.pem;ssl_protocols TLSv1.3;ssl_session_tickets off;ssl_session_cache off;location /{default_type text/plain;return 200 "hello aegis\n";}}
}
