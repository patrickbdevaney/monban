global

 nbthread 1
 ssl-default-bind-options ssl-min-ver TLSv1.3 no-tls-tickets
defaults
 mode http
 timeout client 3600s
 timeout connect 5s
 timeout server 30s
frontend f1
 bind :18080
 http-request return status 200 content-type text/plain string "hello aegis\n"
frontend f2
 bind :18443 ssl crt /w/both.pem alpn h2,http/1.1
 http-request return status 200 content-type text/plain string "hello aegis\n"
