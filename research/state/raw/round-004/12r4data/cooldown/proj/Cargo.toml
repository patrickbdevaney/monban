[package]
name = "golden-lock"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hyper = { version = "=1.12.0", features = ["server","http1","http2"] }
hyper-util = { version = "0.1", features = ["server-auto","tokio"] }
h2 = "=0.4.20"
rustls = { version = ">=0.23.46", default-features = false, features = ["aws-lc-rs","std","tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread","net","macros","time","sync"] }
governor = "=0.10.4"
cedar-policy = "=4.14.0"

[profile.release]
lto = true
codegen-units = 1
debug = 0
panic = "abort"
