# AEGIS io_uring front: systemd drop-in for deploy/aegis-hardened.service (PREFLIGHT D-P7.3, unit P7-oracle-uring-001).
# OPT-IN, NOT INSTALLED BY DEFAULT. The hardened unit denies io_uring_setup/_enter/_register; this drop-in re-admits
# exactly those three syscalls and nothing else (gate front-equiv checks that, and that exposure stays <= 2.0).
# TCB: it widens the kernel attack surface to the io_uring subsystem (>= 8 HIGH io_uring CVEs in 2026; Docker's
# default seccomp profile and Google production both deny it). Use it only with a build that has feature `uring`.
#
# Install:  /etc/systemd/system/aegis.service.d/uring.conf
# Select:   "front": "uring" on the listener in /etc/aegis/aegis.json (or `--front uring` on ExecStart)
# Apply:    systemctl daemon-reload && systemctl restart aegis
# Without this drop-in, a uring front cannot start under the hardened unit: io_uring_setup returns EPERM and aegis
# refuses to boot (it never falls back to epoll).
[Service]
SystemCallFilter=io_uring_setup io_uring_enter io_uring_register
