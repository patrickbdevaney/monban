[package]
name = "transport-subject"
description = "Oracle subject for oracles/transport-stall and h2spec: TLS (monban-tls PublicWeb) + monban-transport serving a fixed 200 and a large body."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.monban]
layer = "tool"

[dependencies]
monban-transport = { workspace = true, features = ["negative-control"] }
monban-config = { workspace = true }
monban-canon = { workspace = true }
monban-types = { workspace = true }
monban-tls = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[lints]
workspace = true
