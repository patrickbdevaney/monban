[package]
name = "tls-subject"
description = "Oracle subject for oracles/hrr-verdicts (F12): builds every listener config through aegis-tls's public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = "tool"

[features]
# PLAN-6 D1: the subject built against the cmvp overlay lock (profiles/cmvp/build.sh).
# Exclusive with `interop`: profiles/cmvp/build.sh builds tls-subject with --no-default-features.
cmvp = ["aegis-tls/cmvp"]
# oracles/kx-interop `interop-client`: the product client builder `aegis_tls::client_config`. On in the floor build,
# off in the cmvp build (no rustls client there, spikes/cmvp-client-policy mode A).
default = ["interop"]
interop = ["aegis-tls/tls-client"]

[dependencies]
aegis-tls = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }

[lints]
workspace = true
