[package]
name = "upgrade-subject"
description = "Oracle subject: a tiny HTTP/1.1 server that self-upgrades on SIGHUP through monban-ops (UP-1..7), for oracles/upgrade-harness. Never linked into monban."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.monban]
layer = "tool"

# No third-party dependencies: rustix, tokio (signals) and sd-notify stay inside monban-ops.
[dependencies]
monban-ops = { workspace = true }

[lints]
workspace = true
