[package]
name = "upgrade-subject"
description = "Oracle subject: a tiny HTTP/1.1 server that self-upgrades on SIGHUP through aegis-ops (UP-1..7), for oracles/upgrade-harness. Never linked into aegis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = "tool"

# No third-party dependencies: nix and sd-notify stay inside aegis-ops.
[dependencies]
aegis-ops = { workspace = true }

[lints]
workspace = true
