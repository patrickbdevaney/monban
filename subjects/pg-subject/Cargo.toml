[package]
name = "pg-subject"
description = "Oracle subject: the owned PG v3 client and version gate of aegis-adapter-pg over JSON lines (oracles/pg-version-gate). Never linked into aegis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.aegis]
layer = "tool"

# No third-party dependencies: the wire client, SCRAM (aws-lc-rs) and the pins-compiled gate stay in the adapter.
[dependencies]
aegis-adapter-pg = { workspace = true }

[lints]
workspace = true
