[package]
name = "pg-subject"
description = "Oracle subject: monban-adapter-pg over JSON lines: owned PG v3 client + version gate (oracles/pg-version-gate), renderer (oracles/lowering-read, lowering-write), live schema gate (oracles/schema-gate). Never linked into monban."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.monban]
layer = "tool"

# No third-party dependencies: the wire client, SCRAM (aws-lc-rs), the gate, renderer and introspection stay in the adapter.
[dependencies]
monban-adapter-pg = { workspace = true }

[lints]
workspace = true
