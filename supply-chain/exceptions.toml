expires = "2027-01-29"
evidence = "phase{phase}-panic-abort-cmd.log"
evidence_must = "PANIC-ABORT: PASS (release builds panic = abort; no derived profile or cmvp overlay overrides it)"

# P6-spec-002 (PLAN-6 D1/D10): the cmvp lock (profiles/cmvp/Cargo.lock, FIPS 3.1.0 triangle) cannot reach the
# rustls 0.23.46 / rustls-webpki 0.103.16 floors: both need aws-lc-rs ^1.18, whose fips feature links the uncertified
# AWS-LC FIPS 4.2.0. These entries apply to the cmvp lock only (`cargo xtask fips-lock --profile cmvp` G4 requires
# them); the root (floor) lock is at the floors. Each stays valid only while the cmvp client-policy gate passes in
# the same run with every rustls client compiled out (ARCHITECTURE R-PQC cmvp ledger, condition 1).

[[exception]]
crate = "rustls"
version = "0.23.43"
kind = "advisory-accepted"
advisory = "RUSTSEC-2026-0349"
reason = "cmvp lock only: 0349 is a client-side bug (an unauthenticated ServerHello poisons the per-name key-share record); the cmvp build compiles every rustls client out (aegis-tls tls-client off, egress tls-client off), proven per run by the cmvp client-policy gate; fixed in 0.23.46, which the FIPS 3.1.0 module (aws-lc-rs <=1.17.1) cannot be co-resolved with"
approver = "integrator (operator standing authorization 2026-11-04)"
expires = "2027-05-04"
evidence = "gates/out/logs/phase{phase}-cmvp-client-policy-cmd.log"
evidence_must = "CLIENT-POLICY: PASS (compiled-out)"

[[exception]]
crate = "rustls-webpki"
version = "0.103.13"
kind = "advisory-accepted"
advisory = "RUSTSEC-2026-0382"
reason = "cmvp lock only: 0382 lets certificate path building accept distrusted (emSign) intermediates, which matters only where a WebPKI chain is verified; the cmvp build has no rustls client (client-policy gate, compiled-out) and no listener verifies client certificates (P6-cmvp-001 D13: every ServerConfig is built with_no_client_auth, and ci/cmvp-supply.sh fails if any crate in the cmvp graph names a client-certificate verifier: `CMVP-PREMISE client-auth` line of the fips-lock log); 0.103.14+ need aws-lc-rs ^1.18 (uncertified module)"
approver = "integrator (operator standing authorization 2026-11-04)"
expires = "2027-05-04"
evidence = "gates/out/logs/phase{phase}-cmvp-client-policy-cmd.log"
evidence_must = "CLIENT-POLICY: PASS (compiled-out)"

# P6-cmvp-001 (PLAN-6 D12): the rest of what `cargo audit` reports on profiles/cmvp/Cargo.lock (ARCHITECTURE
# R-PQC-2 lists the set). ci/cmvp-supply.sh (fips-lock gate) fails on any reported advisory without a live
# advisory-accepted entry here; each entry's premise is a fixed line of that gate's log (or the client-policy log).
# All are cmvp lock only: the root (floor) lock is at aws-lc-fips-sys >= 0.13.13-free / rustls 0.23.46.

[[exception]]
crate = "aws-lc-fips-sys"
version = "0.13.11"
kind = "advisory-accepted"
advisory = "RUSTSEC-2026-0042"
reason = "cmvp lock only: the CRL distribution-point scope error is in AWS-LC's X509 chain verifier with X509_V_FLAG_CRL_CHECK; no Rust code in the cmvp graph calls X509_verify_cert or sets CRL checking (aws-lc-rs 1.15.3 exposes no X509 API; TLS chains go through rustls-webpki), checked per run by the ci/cmvp-supply.sh source scan; fixed in 0.13.13, which is not the certified FIPS 3.1.0 module"
approver = "integrator (PLAN-6 D12 permission to P6-cmvp-001; operator standing authorization 2026-11-04)"
expires = "2027-05-04"
evidence = "gates/out/logs/phase{phase}-fips-lock-cmd.log"
evidence_must = "CMVP-PREMISE 0042: PASS (no Rust caller of AWS-LC X509 verification or CRL checking in the cmvp graph)"

[[exception]]
crate = "aws-lc-fips-sys"
version = "0.13.11"
kind = "advisory-accepted"
advisory = "RUSTSEC-2026-0043"
reason = "cmvp lock only: the AES-CCM tag-verification timing leak is in EVP_aes_{128,192,256}_ccm; no Rust code in the cmvp graph calls them (aws-lc-rs 1.15.3 AEADs used are AES-GCM; the TLS profiles are AES-GCM only), checked per run by the ci/cmvp-supply.sh source scan; fixed in 0.13.12, which is not the certified FIPS 3.1.0 module"
approver = "integrator (PLAN-6 D12 permission to P6-cmvp-001; operator standing authorization 2026-11-04)"
