# Live database engine pins (ENGINE_PIN) for Phase 4. Owner: P4-engines-001. Consumers: ci/engines.sh (starts and
# version-checks the containers), oracles/* --engine-pin (put the version in the PASS line), monban-adapter-pg build.rs
# (compiles the PG floors; no hand-copied constant), oracles/pg-version-gate (refusal matrix).
# Resolved 2026-10-30 by reading the advisories cited per entry. A bump is a spec-change PR: new digest + config_digest + image_id +
# bytes + version, re-run `ci/engines.sh self-test && ci/engines.sh with <all> -- ci/engines.sh versions`, and re-run every
# ">= 100k cases per ENGINE_PIN" oracle (SPEC §E).
#
# Semantics (enforced by ci/engines.sh, which must stay in sync with this comment):
#   image@digest      the only reference ever run; tags are informational. A missing/short/non-sha256 digest is refused.
#   config_digest     sha256 of the linux/amd64 image config blob: the same on every host (R16, P8-spec-002). A classic
#                     store must report it as the image Id; a containerd store must report Id = digest (the index) and
#                     its `docker save --platform linux/amd64` config must hash to it (ci/engines.sh docs). Required.
#   image_id          the Id the pinning host's store reported (classic: = config_digest; containerd: = digest);
#                     informational, but it must equal one of the two. The image must also list image@digest.
#   bytes             recorded `docker image inspect .Size`; any image whose live size > max_image_bytes is refused.
#   version           exact server-reported version (PG: server_version leading token; Valkey: valkey_version;
#                     Redis: redis_version). The running engine must report exactly this, else teardown + refuse.
#   policy            "allow": version must satisfy the floor rule below.
#                     "blocked": engines.sh still starts it (oracles need a live refusal target) but `versions` labels
#                     it BLOCKED and the adapter must refuse every version of that major (pg19-blocked gate).
#   floor (postgres)  numeric (major, minor) compare, same major only; pre-releases (rc/beta) never satisfy a floor.
#   fixed_in (kv)     per-branch first fixed release. A version is accepted only if its major.minor branch is listed
#                     and version >= that entry. Unlisted branches are refused: newer branches are NOT assumed fixed
#                     (Redis 8.8.x shipped after the fix and is still unfixed, see engines.redis).

schema = 1
max_image_bytes = 500_000_000   # CLAUDE.md "No Docker image > 500 MB" (decimal MB, as docker reports Size)

# No container: the adapter and oracles link it (rusqlite =0.41.1 bundled -> libsqlite3-sys 0.39.1 -> SQLite 3.54.1).
# Bumped 2026-11-09 from 3.53.2 (rusqlite 0.40.2 / libsqlite3-sys 0.38.2) for RUSTSEC-2026-0459; the floor rose
# from 3.51.3 to 3.54.0 with it (both advisories below; the store runs WAL and the adapter opens operator files).
[sqlite]
version = "3.54.1"
floor = "3.54.0"
advisory = "SQLite WAL-reset corruption bug 3.7.0 .. 3.51.2, fixed 3.51.3 (2026-03-13); backports 3.44.6, 3.50.7; CVE-2026-119375 (RUSTSEC-2026-0459) uninitialized page-cache memory from a db and -wal of differing page size, all < 3.54.0, fixed 3.54.0"
sources = [
  "research/state/raw/round-001/09-state-durability-and-db-gate-failure-modes.progress.md (WAL-reset bug range)",
  "research/ARCHITECTURE.md R-STATE-4 (SQLite >= 3.51.3)",
  "advisory-db crates/libsqlite3-sys/RUSTSEC-2026-0459.md (CVE-2026-119375; patched in libsqlite3-sys 0.39.0, SQLite 3.54.0)",
  "oracles/crash-harness/rust/refstore/Cargo.toml (rusqlite =0.41.1 bundles 3.54.1)",
]

