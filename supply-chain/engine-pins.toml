bytes = 118_845_025
version = "8.10.2"  # 8.10.3 (2026-10-26, cluster-bus PUBLISH >4GB fix; we run standalone) bump after cooldown
policy = "allow"
fixed_in = ["7.2.13", "7.4.8", "8.0.6", "8.2.5", "8.4.2", "8.6.1", "8.10.0"]
port = 6379
tmpfs = "/data"
advisory = "CVE-2025-67733"
sources = [
  "https://lists.debian.org/debian-security-announce/2026/msg00190.html (DSA-6279-1)",
  "https://security-tracker.debian.org/tracker/CVE-2025-67733",
  "https://github.com/redis/redis/releases/tag/8.6.1 (and 8.4.2, 8.2.5, 8.0.6, 7.4.8, 7.2.13: same security line)",
