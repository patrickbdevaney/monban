# PG19 blocked: ON CONFLICT ... WHERE evaluated before the RLS check (R-DB-8, wpo-pg-onconflict-where-peek A 0.86).
# 2026-10-30 lowering-write --pg-onconflict-info: the peek reproduces on 19rc1 AND on 17.11/18.6 (mandated form clean);
# new in 19: ON CONFLICT DO SELECT through a security_barrier view returns another tenant's row.
# Lifting it is a spec change naming the fixed 19.x minor plus a passing lowering-write RLS ON CONFLICT family on it.
[engines.pg19rc1]
kind = "postgres"
image = "postgres"
tag = "19rc1"
digest = "sha256:de2cbeff2b8177e65bd64d077b46c90a1898aa8aea974a9e35a8cf60b5e90581"
image_id = "sha256:70a5d673564d822eef31ca15298d7a5a697aa3316d27c339c59bbc8199e00c42"
bytes = 461_286_432
version = "19rc1"
policy = "blocked"
blocked_reason = "R-DB-8: ON CONFLICT WHERE evaluated before RLS (also reproduces on 17.11/18.6, where only the mandated composite-arbiter, no-user-WHERE form protects); 19 adds DO SELECT via security_barrier view leaking foreign rows; every 19.x refused until a named fixed minor"
port = 5432
tmpfs = "/var/lib/postgresql"
sources = ["research/ARCHITECTURE.md R-DB-8", "units/phase-4/PLAN.md 'Infeasible or blocked as written'"]

# ---------------------------------------------------------------- Valkey / Redis ------------------------------------
# CVE-2025-67733: RESP protocol injection via Lua error replies (CR/LF / NUL in error_reply or error()), CVSS 8.5,
# GHSA-p876-p7q5-hv2m published 2026-02-23. The core also never shares a backend connection across tenants (R-DB-5).
#
# Valkey: GHSA/OSV list patched 9.0.2, 8.1.6, 8.0.7, 7.2.12. But the 9.0.2 release notes (2026-02-03, before the
# advisory) do not list the CVE; 9.0.3 (2026-02-24) does. Conservative floor for 9.0 is therefore 9.0.3. The unstable
# fix (PR #3249, merge 0d713a4e, 2026-02-23) is an ancestor of tags 9.1.0-rc1, 9.1.0 and 9.1.2 (GitHub compare:
# "behind"), so 9.1 is fixed from 9.1.0.
[engines.valkey]
kind = "valkey"
image = "valkey/valkey"
tag = "alpine"
digest = "sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11"
image_id = "sha256:40ab224f823ae96d9d05adfbb31d7068cbf96708be5d8b2691621b703a02de3d"
bytes = 45_158_671
version = "9.1.2"   # 9.1.3 (2026-10-26) exists; inside the 7-day cooldown on 2026-10-30, bump after 2026-11-02
policy = "allow"
fixed_in = ["7.2.12", "8.0.7", "8.1.6", "9.0.3", "9.1.0"]
port = 6379
tmpfs = "/data"
advisory = "CVE-2025-67733"
sources = [
  "https://github.com/valkey-io/valkey/security/advisories/GHSA-p876-p7q5-hv2m",
  "https://osv.dev/vulnerability/CVE-2025-67733",
  "https://github.com/valkey-io/valkey/releases/tag/9.0.3 (lists CVE-2025-67733; 9.0.2 notes do not)",
  "https://github.com/valkey-io/valkey/releases/tag/8.1.6",
  "https://github.com/valkey-io/valkey/releases/tag/8.0.7",
  "https://github.com/valkey-io/valkey/releases/tag/7.2.12",
  "https://github.com/valkey-io/valkey/pull/3249 (unstable fix, ancestor of 9.1.0)",
  "https://security-tracker.debian.org/tracker/CVE-2025-67733",
]

# Redis: no Redis-side GHSA/CVE text; Debian DSA-6279-1 (2026-05-17) assigns CVE-2025-67733 to the redis package
# ("CR/LF byte sequences in an error reply produced via redis.error_reply() or error()"). Upstream fix "Strip CRLF from
# error and simple string replies" (#826) shipped 2026-02-23 in 8.6.1, 8.4.2, 8.2.5, 8.0.6, 7.4.8, 7.2.13 (release
# notes: "injecting \r\n sequences into a Redis error reply"). Unstable only got it on 2026-07-20 (#15496, e1cc3dc2),
# first in 8.10-rc2: tags 8.8.0..8.8.4 and 8.10-rc1 lack addReplyErrorSdsExSafe and still call addReplyErrorSdsEx on the
# Lua error path (checked in src/networking.c and src/script_lua.c at those tags). So 8.8 is NOT listed: refused.
[engines.redis]
kind = "redis"
image = "redis"
tag = "alpine"
digest = "sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0"
