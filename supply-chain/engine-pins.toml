# ---------------------------------------------------------------- MariaDB / CockroachDB (Phase 7, D-P7.8) ----------
# Added 2026-11-06 by P7-oracle-adapters-001 after reading the advisories below (User-Agent aegis-ci for registry
# and API calls). Measured on kamrui (docker 29.1.3, containerd snapshotter store): there `docker image inspect` Id is
# the index digest (recorded as image_id; config_digest is the Id a classic store reports) and .Size is the
# compressed content, so `bytes` is the unpacked size = sum of `docker history` layer sizes, which ci/engines.sh
# checks (max(inspect .Size, history sum) <= max_image_bytes). registry_* fields were measured by streaming and
# gunzipping every amd64 layer from registry-1.docker.io (nothing stored). Both are >= 7 days old on 2026-11-06.
# floor (mariadb, crdb): same release series (major.minor) only, numeric compare, no pre-releases.
# MySQL stays out: mysql:8.4 is 829.2 MB unpacked (> 500 MB; spikes/q4-005).

