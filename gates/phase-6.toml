# ======================================================================== Phase 5 additions

[[gate]]
name = "p2-fault-forkwasm"
# Quiet runner, gate timing mode, 3 trials per cell (PLAN D14). Gated: G0-G4 on panic, abort, segv, loop, oom,
# poison AND hostabort, hostpoison (the fork+Wasm containment claim, q4-006).
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p p2-subject && ci/quiet.py oracles/isolation-fi/run --trials 3 --record gates/out/p2-fault-forkwasm.json --path forkwasm --subject 'target/p2/release/p2-subject serve forkwasm {guest} {data}'"
# Red on: oracle reference mutants (no-fork, no-deadline) and the real subject built with `mutants`
# (AEGIS_P2_MUTANT = no-fork | no-deadline | reuse-instance), while the unmutated real subject passes.
selftest = "CARGO_TARGET_DIR=target/p2-mutants ci/heavy.sh cargo build --release --locked -q -p p2-subject --features p2-subject/mutants && ci/quiet.py oracles/isolation-fi/run --self-test && ci/quiet.py oracles/isolation-fi/run --self-test --path forkwasm --subject 'target/p2/release/p2-subject serve forkwasm {guest} {data}' --mutant-subject 'target/p2-mutants/release/p2-subject serve forkwasm {guest} {data}'"
heavy = true
remote = "quiet"
# Quiet runner under ci/quiet.py (see oracles-quiet); the run voids itself under foreign load.

[[gate]]
name = "p2-fault-cordon"
# Quiet runner, gate timing mode, 3 trials. Gated: G0-G4 on the 6 guest classes; hostabort/hostpoison are
# reported only (a per-principal cordon keeps the damage with one principal; shared cordons are unrepresentable, D1).
# The MPK density option (PLAN D11) runs in p2-fault-vps on kamrui: wasmtime 50 enables MPK only on Intel CPUs
# (wasmtime-internal-core mpk::is_intel_cpu); the desktop is AMD ("mpk is disabled on this system") and the GCP quiet
# runner's Xeon is Intel but the hypervisor hides `pku` from the guest.
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p p2-subject && ci/quiet.py oracles/isolation-fi/run --trials 3 --record gates/out/p2-fault-cordon.json --path cordon --subject 'target/p2/release/p2-subject serve cordon --threads 64 {guest} {data}'"
# Red on: shared-store, recycle50, no-deadline, epoch-only-4 (real subject with `mutants`) plus the reference mutants.
selftest = "CARGO_TARGET_DIR=target/p2-mutants ci/heavy.sh cargo build --release --locked -q -p p2-subject --features p2-subject/mutants && ci/quiet.py oracles/isolation-fi/run --self-test && ci/quiet.py oracles/isolation-fi/run --self-test --path cordon --subject 'target/p2/release/p2-subject serve cordon --threads 64 {guest} {data}' --mutant-subject 'target/p2-mutants/release/p2-subject serve cordon --threads 64 {guest} {data}'"
heavy = true
remote = "quiet"
# Quiet runner under ci/quiet.py (see oracles-quiet); the run voids itself under foreign load.

[[gate]]
name = "p2-syscall-negative"
# Laptop: Linux 6.17 with kernel.apparmor_restrict_unprivileged_userns=1 (PLAN D2). Pass only on the filter's own
# signature (SIGSYS from KILL_PROCESS; ENOSYS for clone3), never on EPERM; every probe runs an unfiltered control
# first and records host facts. Probes both the p2-subject (both paths) and the real worker (test-hooks build).
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p p2-subject && CARGO_TARGET_DIR=target/p2-test ci/heavy.sh cargo build --release --locked -q -p aegis-p2 --features aegis-p2/test-hooks && oracles/syscall-negative/run --subject 'target/p2/release/p2-subject probe' && oracles/syscall-negative/run --subject 'target/p2-test/release/aegis-p2 probe'"
# Red on: no-clone-flag-filter, no-denylist, eperm-instead-of-kill, clone3-allowed, dumpable-1, no-landlock,
# no-child-filter (oracle reference mutants).
selftest = "oracles/syscall-negative/run --self-test"
heavy = true

[[gate]]
name = "p2-hostile-worker"
# Corpus I1 (imports, handles) and I2 (fuel, epoch, memory, table, stack, host-call and byte quotas) against the
# aegis-p2 worker with the oracle as mock supervisor over F14. Count criteria only, so the desktop is fine.
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p aegis-p2 && oracles/hostile-modules/run --level worker --subject target/p2/release/aegis-p2"
# Red on: extra-import, handle-not-cleared, no-hostcall-quota, no-fuel-no-epoch, no-limiter.
selftest = "CARGO_TARGET_DIR=target/p2-mutants ci/heavy.sh cargo build --release --locked -q -p aegis-p2 --features aegis-p2/mutants && oracles/hostile-modules/run --self-test && oracles/hostile-modules/run --self-test --level worker --subject target/p2/release/aegis-p2 --mutant-subject target/p2-mutants/release/aegis-p2"
heavy = true
remote = true

[[gate]]
name = "p2-hostile-host"
# Corpus I1 (capabilities at the supervisor), I5, I6-host, I7 end to end through the real aegis binary (p2 + native:
# data_run reaches the Phase-4 adapters; SQLite only, no engine container) and the release worker.
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2,aegis-bin/native -p aegis-p2 && oracles/hostile-modules/run --level host --subject target/p2/release/aegis --worker target/p2/release/aegis-p2 && echo \"CONFORMANCE-ARTIFACT: aegis-p2 sha256 $(sha256sum target/p2/release/aegis-p2 | cut -d' ' -f1)\""
# Red on: raw-passthrough, double-response-accepted, audit-after-effect, no-audit-on-trap, trap-maps-to-allow,
# data-run-skips-authorize, tenant-not-overwritten.
selftest = "CARGO_TARGET_DIR=target/p2-mutants ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2,aegis-bin/native,aegis-bin/p2-mutants -p aegis-p2 && oracles/hostile-modules/run --self-test && oracles/hostile-modules/run --self-test --level host --subject target/p2/release/aegis --worker target/p2/release/aegis-p2 --mutant-subject target/p2-mutants/release/aegis --mutant-worker target/p2-mutants/release/aegis-p2"
heavy = true
remote = true

[[gate]]
name = "wasmtime-config"
# R-ISO-2: wasmtime =50.0.0; default-features=false + cranelift, pooling-allocator, runtime, std only; no gc/threads/
# winch/wasi/wasi-http/component-model-async; memory64=false, gc=false; 4 GiB reservation + 32 MiB guard never shrunk
# (GHSA-6wgr, GHSA-394w shapes as recorded from the advisories); MPK only with those values unchanged; epoch + fuel on;
# exactly one Module::deserialize site. Expected values: supply-chain/wasmtime-config.toml.
cmd = "CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p aegis-p2 && python3 -I ci/wasmtime-config.py check --worker target/p2/release/aegis-p2"
selftest = "python3 -I ci/wasmtime-config.py --self-test"
remote = true

[[gate]]
name = "p2-fault-vps"
# VPS-class re-run on kamrui (Intel N95, 4 cores, Linux 6.17.0-41) through ci/remote.sh --host kamrui (not
# `remote = true`, which is the desktop). Same thresholds as the laptop; isolation-fi prints kamrui/laptop ratios
# against gates/p2-runner-reference.json and flags >2x, but never moves a threshold (PLAN D10: only an integrator
# Decision with both measurements may). Count criteria never move. Also re-runs the syscall probes on kamrui's kernel.
# Every step runs and the exit codes are combined, so one red path does not hide the others (P5-vps-001).
# PLAN-5 D23 option (b), operator decision 2026-10-31: the 5 ms recovery threshold is kept and the fresh-Wasm cordon
# is the DEFAULT path on VPS-class hosts (`p2.isolation` "auto": cordon below 8 usable CPUs). So on kamrui:
#  - cordon is the path that ships by default here and stays fully gated (G0-G4, thresholds unchanged);
#  - forkwasm is not the default here: its count criteria (G0-G2, unrecovered requests) stay gated, its timing
#    criteria (G3 recovery p99, G4 loop throughput) are report-only (`--timing advisory`; the PASS line says
#    "timing ADVISORY" and the kamrui/laptop ratios are still printed). This is the operator's D23 decision, not a
#    threshold move: the quiet-runner gates p2-fault-forkwasm / p2-fault-cordon (quiet runner, ci/quiet.py) keep both paths fully timed, and an
#    explicit `isolation: "forkwasm"` on a small host is outside what kamrui's numbers support (claims <= B);
#  - cordon also runs with the MPK density option (PLAN D11), fully gated, same thresholds: kamrui is the Intel
#    runner with PKU (wasmtime 50 enables MPK only on Intel CPUs, so the AMD desktop cannot run it);
#  - the last step builds aegis (feature p2) and checks that the default config resolves to cordon on this host
#    (ci/p2-auto-resolve.py: `check-config --print-effective` shows isolation auto -> cordon at 4 usable CPUs).
cmd = "ci/remote.sh --host kamrui bash -c \"cargo build --release --locked -q -p p2-subject || exit 1; rc=0; echo 'p2-fault-vps: forkwasm timing (G3 recovery p99, G4 loop) is report-only on kamrui by PLAN-5 D23 option (b); its count criteria stay gated'; oracles/isolation-fi/run --timing advisory --trials 3 --server-core 1 --client-cores 2,3 --reference gates/p2-runner-reference.json --path forkwasm --subject 'target/release/p2-subject serve forkwasm {guest} {data}' || rc=1; oracles/isolation-fi/run --trials 3 --server-core 1 --client-cores 2,3 --reference gates/p2-runner-reference.json --path cordon --subject 'target/release/p2-subject serve cordon --threads 64 {guest} {data}' || rc=1; oracles/isolation-fi/run --trials 3 --server-core 1 --client-cores 2,3 --reference gates/p2-runner-reference.json --path cordon --subject 'target/release/p2-subject serve cordon --threads 64 --mpk {guest} {data}' || rc=1; oracles/syscall-negative/run --subject 'target/release/p2-subject probe' || rc=1; CARGO_TARGET_DIR=target/p2 cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2 && python3 -I ci/p2-auto-resolve.py --subject target/p2/release/aegis --expect cordon || rc=1; exit \\$rc\""
# The oracles must still catch their mutants on this host (a runner where the checks cannot go red proves nothing).
# isolation-fi --self-test always gates timing (its no-deadline mutants are caught through it).
selftest = "ci/remote.sh --host kamrui bash -c 'oracles/isolation-fi/run --self-test --server-core 1 --client-cores 2,3 && oracles/syscall-negative/run --self-test && python3 -I ci/p2-auto-resolve.py --self-test'"
heavy = true

[[gate]]
name = "p2-e2e"
# Quiet runner (oracle needs=quiet-host). Real aegis (feature p2) + release worker; the exec-respawn family
# uses the test-hooks worker (load-base report). Families: wasm: routes under both paths and across a reload that
# switches the default; one cordon per principal; the default isolation "auto" (PLAN-5 D23(b)) under taskset: 4 CPUs
# -> cordon per principal, no zygote; 8 CPUs -> zygote (this host needs >= 8 usable CPUs, else that check FAILs); exec respawn (new pid, new load base); crash budget 3/60 s -> 429
# for 600 s (scaled knobs + effective defaults from the config dump); dumpable=0 (root-owned /proc/<pid>);
# fail-closed boot (missing worker, Landlock ABI < 4, shared-cordon config) -> exit 78.
cmd = "rustup target add wasm32-unknown-unknown >/dev/null 2>&1; CARGO_TARGET_DIR=target/p2 ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2 -p aegis-p2 && CARGO_TARGET_DIR=target/p2-test ci/heavy.sh cargo build --release --locked -q -p aegis-p2 --features aegis-p2/test-hooks && ci/quiet.py oracles/p2-e2e/run --subject target/p2/release/aegis --worker target/p2/release/aegis-p2 --test-worker target/p2-test/release/aegis-p2"
# Red on: shared-cordon, fork-respawn, global-crash-budget, no-crash-budget, budget-counts-healthy, dumpable-1,
# no-reload-switch, boot-without-landlock-accepted, auto-ignores-cpus.
# --mutant-test-worker: the respawn family needs a mutants+test-hooks worker (env.host_fault abort guest); a
# mutants-only worker refuses that guest and the baseline fails on respawn.harness (P5-bin-001, D22).
selftest = "rustup target add wasm32-unknown-unknown >/dev/null 2>&1; CARGO_TARGET_DIR=target/p2-mutants ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2,aegis-bin/p2-mutants -p aegis-p2 --features aegis-p2/mutants && CARGO_TARGET_DIR=target/p2-mutants-test ci/heavy.sh cargo build --release --locked -q -p aegis-p2 --features aegis-p2/mutants,aegis-p2/test-hooks && CARGO_TARGET_DIR=target/p2-test ci/heavy.sh cargo build --release --locked -q -p aegis-p2 --features aegis-p2/test-hooks && ci/quiet.py oracles/p2-e2e/run --self-test && ci/quiet.py oracles/p2-e2e/run --self-test --subject target/p2/release/aegis --worker target/p2/release/aegis-p2 --test-worker target/p2-test/release/aegis-p2 --mutant-subject target/p2-mutants/release/aegis --mutant-worker target/p2-mutants/release/aegis-p2 --mutant-test-worker target/p2-mutants-test/release/aegis-p2"
heavy = true
remote = "quiet"
# Quiet runner under ci/quiet.py (see oracles-quiet); the run voids itself under foreign load.

[[gate]]
name = "no-wasmtime-in-bin"
# PLAN D3 / X-13: wasmtime and cranelift link only into the aegis-p2 worker, never into any aegis-bin build.
cmd = "! cargo tree --locked -e normal,build -p aegis-bin --all-features --prefix none | grep -qE '^(wasmtime|wasmtime-environ|cranelift-codegen) '"
# Positive control: the same filter finds wasmtime where it must be (as no-cedar-in-bin).
selftest = "cargo tree --locked -e normal,build -p aegis-p2 --prefix none | grep -q '^wasmtime '"

[[gate]]
name = "unsafe-sites"
# PLAN D4 / X-14: aegis-iso <= 20 unsafe sites, aegis-wasm exactly 1 (Module::deserialize after the digest check),
# every site with // SAFETY:, no other crate relaxes forbid(unsafe_code).
cmd = "cargo xtask unsafe-sites"
selftest = "cargo xtask unsafe-sites --self-test"

