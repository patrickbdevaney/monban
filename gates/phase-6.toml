# oracles-quiet on the quiet runner: the laptop is the operator's workstation and is not quiet during an 8-hour run
# (isolation-fi reference cordon oom rec_p99 5.2-18.8 ms at load 8-40 vs 3.26 ms quiet; 17.2 ms in a CPU-quiet
# window at memory PSI some avg10 3.1, 2026-11-01).
