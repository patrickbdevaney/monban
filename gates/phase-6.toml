# (IMPLEMENTATION_PLAN §3 Phase 6). Run: python3 -I ci/run-gates.py --phase 6
# Plan, decisions and owner units: units/phase-6/PLAN.md, PREFLIGHT.md and units/phase-6/*.json (owner in brackets).
# Carries all 68 Phase-5 gates with their Phase-5 placement; tls-verdicts judges F12 as re-frozen by P6-spec-001 and
# proof includes AegisIR.Select. Placement of new gates (operator 2026-11-04: CI on kamrui, GCP VM as needed):
#   remote = "kamrui" ... docker / OpenSSL 3.5.3 / Go 1.27.3 / FIPS module gates
#   release-rebuild ..... runs from the laptop and drives kamrui (build A) and aegis-quiet (build B, started and
#                          stopped by the gate)
# Phase-6 additions:
#   exactly one fips-sys node reachable from aws-lc-rs; floor lineage (lock half) ..... fips-lock          [P6-spec-002]
#   'AWS-LC FIPS 3.1.0' in the cmvp binary; linked module; --fips-check ............... fips-binary        [P6-cmvp-001]
#   cmvp client policy (compiled-out | pq-only) ........................................ cmvp-client-policy [P6-oracle-fips-001]
#   release panic = abort (evidence for the block-buffer ledger entry) .................. panic-abort        [integrator]
#   exception ledger valid; 0349 cites the client-policy log ............................ exception-ledger   [P6-oracle-ledger-001]
#   ClientHello matrix, cmvp half (--require-cmvp) ...................................... clienthello-cmvp   [P6-cmvp-001]
#   Lean group-selection model vs oracle selection, 1e5 cases/profile ................... select-drt         [P6-spec-003]
#   0x11ED KATs (+ order mutant) ........................................................ kx-kat             [P6-tls-001]
#   0x11ED/0x11EB/0x0202/0x11EC interop: OpenSSL 3.5.3, Go 1.27.3, BoringSSL (D-P4) ..... kx-interop         [P6-oracle-interop-001]
#   Kani share-parsing harness .......................................................... kani-kx            [P6-kani-001]
#   triple signature, TUF 3/5, test-key refusal, rollback ............................... release-verify     [P6-release-001]
#   second-runner hash = attested digest (floor + cmvp) ................................. release-rebuild    [P6-release-002]
#   conformance C0-C2 100% (golden floor + cmvp) ........................................ conformance        [P6-conformance-001]
#   COMPLIANCE_MAP gate ids, SA-17(1) theorems, CRA drafts unpublished .................. compliance         [P6-compliance-001]
phase = 6
go_no_go = "all gates pass && all self-tests pass"

