heavy = true

[[gate]]
name = "oracles-quiet"
# needs=quiet-host oracles (ct-dudect, isolation-fi, native-e2e, p2-e2e) on the quiet runner, each under ci/quiet.py:
# it waits until foreign CPU load (host busy minus this job's cgroup) stays <= 2.0 cores for 30 s, samples it every
# 5 s during the run, and voids any attempt with a window above 2.0 cores (re-run, up to 6; none valid = exit 75,
# red). A valid FAIL is final. Timing criteria are gated here (no AEGIS_TIMING_GATES=advisory). Builds are separate
# cargo invocations per feature set (D18). The selftest also proves the guard voids a run under foreign load.
cmd = "rustup target add wasm32-unknown-unknown >/dev/null 2>&1; cargo build --release --locked -q -p ct-subject && CARGO_TARGET_DIR=target/native cargo build --release --locked -q -p aegis-bin --features native && CARGO_TARGET_DIR=target/p2 cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2 -p aegis-p2 && CARGO_TARGET_DIR=target/p2-test cargo build --release --locked -q -p aegis-p2 --features aegis-p2/test-hooks && ci/oracles.sh run --where quiet"
selftest = "rustup target add wasm32-unknown-unknown >/dev/null 2>&1; ci/quiet-selftest.sh && cargo build --release --locked -q -p ct-subject && CARGO_TARGET_DIR=target/native cargo build --release --locked -q -p aegis-bin --features native && CARGO_TARGET_DIR=target/native-mutants cargo build --release --locked -q -p aegis-bin --features native,e2e-mutants && CARGO_TARGET_DIR=target/p2 cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2 -p aegis-p2 && CARGO_TARGET_DIR=target/p2-mutants cargo build --release --locked -q -p aegis-bin --features aegis-bin/p2,aegis-bin/p2-mutants -p aegis-p2 --features aegis-p2/mutants && CARGO_TARGET_DIR=target/p2-test cargo build --release --locked -q -p aegis-p2 --features aegis-p2/test-hooks && ci/oracles.sh self-test --where quiet"
heavy = true
remote = "quiet"

