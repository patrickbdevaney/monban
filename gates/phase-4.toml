# DRAFT (spec author, 2026-10-30; not yet run). Phase 4 go/no-go: data plane + native handlers "A/D"
# (IMPLEMENTATION_PLAN §3 Phase 4). Run: python3 -I ci/run-gates.py --phase 4
# Placement: remote = LAN build box (ci/remote.sh); every gate that starts an engine via ci/engines.sh needs Docker and
# runs locally (remote omitted). Oracles/subjects referenced below are created by units/phase-4/*.json (owner unit in
# brackets). Carries every Phase-3 gate (reverse proxy + agent gateway must not regress), then adds:
#   read oracle leak=0 ∧ miss=0, >=100k cases at ENGINE_PIN ....... lowering-read-{sqlite,pg,redis}  [P4-sqlite-001, P4-pg-002, P4-redis-001]
#   write oracle hardened forms 0/300 per family ................... lowering-write-{sqlite,pg,redis} [same]
#   schema gate refuses every counterexample schema ................ schema-gate-{static,sqlite,pg}   [P4-datair-001, P4-sqlite-001, P4-pg-002]
#   INV-NONEMPTY 100k/adapter (+ boot / Unrestricted CI-gated) ..... nonempty-props [P4-host-001], unrestricted-ledger [P4-config-001]
#   allowlist lock regenerates byte-identically .................... allowlist-lock [P4-datair-001]
#   cancel sweep green + self-test red <=100 seeds ................. cancel-sweep [P4-pg-003]
#   CRS differentials incl. nginx CVE-2025-23419 replica ........... crs-tls [P4-oracle-crs-001], crs-data [P4-crs-001]
#   trybuild >=25/32, residual as frozen ........................... sdk-trybuild [P4-oracle-trybuild-001]
#   crash harness incl. double fault ............................... crash-harness [P4-state-001]
#   PG minor floor asserted ........................................ pg-version-floor [P4-pg-001]
#   PG19 blocked until ON CONFLICT fix ............................. pg19-blocked [P4-pg-001]
#   no pg_query in aegis-bin graph ................................. no-pg-query-in-bin [P4-spec-002]
# Added by this plan (not in the §3 list; derived from APPLIED.md q4-001, SPEC INV-IDEMP/NC2/NC6 and modes A/D):
#   F7b host obligations ........................................... sdk-host [P4-host-001]
#   idempotency / latch / outbox ................................... state-props [P4-state-002]
#   native handlers end to end ..................................... native-e2e [P4-bin-001]
phase = 4
go_no_go = "all gates pass && all self-tests pass"

[[gate]]
name = "workflow-lint"
cmd = "zizmor --pedantic --offline .github/"
selftest = "! zizmor --pedantic --offline ci/fixtures/bad-workflow.yml"

[[gate]]
name = "hygiene"
cmd = "cargo fmt --all --check && ci/heavy.sh cargo clippy --workspace --all-targets --locked -q -- -D warnings"
remote = true

[[gate]]
name = "tests"
cmd = "ci/heavy.sh cargo test --workspace --all-targets --locked -q"
remote = true

[[gate]]
name = "layering"
cmd = "cargo xtask layering"
selftest = "cargo xtask layering --self-test"

[[gate]]
name = "interfaces-frozen"
cmd = "python3 -I ci/interfaces.py check"
selftest = "python3 -I ci/interfaces.py self-test"

[[gate]]
name = "proof"
cmd = "ci/heavy.sh ci/gate.sh"
selftest = "ci/gate-selftest.sh"
heavy = true

[[gate]]
name = "deny"
cmd = "cargo deny check"
selftest = "ci/deny-selftest.sh"

[[gate]]
name = "audit"
cmd = "cargo audit --deny warnings"

[[gate]]
name = "vet"
cmd = "cargo vet --locked && python3 -I ci/vet-baseline.py"
selftest = "python3 -I ci/vet-baseline.py --self-test"

[[gate]]
name = "repo-advisories"
cmd = "cargo xtask repo-advisories"
selftest = "cargo xtask repo-advisories --self-test"

[[gate]]
name = "lock-age"
cmd = "cargo xtask lock-age --min-days 7"
selftest = "cargo xtask lock-age --self-test"

[[gate]]
name = "lock-targets"
cmd = "cargo xtask lock-targets"
selftest = "cargo xtask lock-targets --self-test"

[[gate]]
name = "repro"
cmd = "cargo fetch --locked -q && ci/repro.sh"
selftest = "ci/repro.sh --self-test"
heavy = true
remote = true

[[gate]]
name = "fail-closed-boot"
cmd = "ci/heavy.sh cargo build --locked -q -p aegis-bin && { target/debug/aegis; test $? -eq 78; }"
remote = true

[[gate]]
name = "oracles-remote"
cmd = "cargo build --release --locked -q -p transport-subject -p aegis-bin -p audit-subject -p upgrade-subject -p egress-subject -p aegis-pdp -p ct-subject && CARGO_TARGET_DIR=target/e2e-mutants cargo build --release --locked -q -p aegis-bin --features e2e-mutants && AEGIS_TIMING_GATES=advisory ci/oracles.sh run --where remote"
selftest = "CARGO_TARGET_DIR=target/e2e-mutants cargo build --release --locked -q -p aegis-bin --features e2e-mutants && ci/oracles.sh self-test --where remote"
heavy = true
remote = true

[[gate]]
name = "oracles-local"
cmd = "ci/heavy.sh cargo build --release --locked -q -p acme-subject -p audit-subject -p transport-subject -p token-subject && ci/oracles.sh run --where local"
selftest = "ci/oracles.sh self-test --where local"
heavy = true

[[gate]]
name = "build-subjects"
cmd = "ci/heavy.sh cargo build --release --locked -p admission-subject -p canon-subject -p tls-subject -p audit-subject -p upgrade-subject -p acme-subject"
remote = true

[[gate]]
name = "admission-props"
cmd = "ci/heavy.sh oracles/admission-props/run --subject target/release/admission-subject"
selftest = "ci/heavy.sh oracles/admission-props/run --self-test"
remote = true

[[gate]]
name = "canon-diff"
cmd = "oracles/canon-diff/run --subject target/release/canon-subject"
selftest = "oracles/canon-diff/run --self-test"
remote = true

[[gate]]
name = "tls-verdicts"
cmd = "ci/heavy.sh oracles/hrr-verdicts/run --file tls/verdicts.toml --subject 'target/release/tls-subject subject'"
selftest = "ci/heavy.sh oracles/hrr-verdicts/run --self-test"
remote = true

[[gate]]
name = "audit-tlog"
cmd = "oracles/tlog-verify/run --subject target/release/audit-subject"
selftest = "oracles/tlog-verify/run --self-test"

[[gate]]
name = "upgrade"
cmd = "cargo build --release --locked -q -p upgrade-subject && oracles/upgrade-harness/run --subject target/release/upgrade-subject --reloads 100 --listeners 4 && oracles/upgrade-harness/run --subject target/release/upgrade-subject --reloads 100"
selftest = "oracles/upgrade-harness/run --self-test"
heavy = true
remote = true   # timing-sensitive: fails under unrelated CPU saturation on the laptop (load 76–135 measured)

[[gate]]
name = "acme-cert"
cmd = "oracles/acme-pebble/run --subject target/release/acme-subject"
selftest = "oracles/acme-pebble/run --self-test"
heavy = true

[[gate]]
name = "metrics"
cmd = "cargo xtask metrics-check"
selftest = "cargo xtask metrics-check --self-test"
remote = true

[[gate]]
name = "budget"
cmd = "cargo xtask budget"
selftest = "cargo xtask budget --self-test"
remote = true

[[gate]]
name = "config-totality"
cmd = "AEGIS_CONFIG_ITERS=1000000 ci/heavy.sh cargo test --release --locked -q -p aegis-config"
remote = true

[[gate]]
name = "h2-conformance"
cmd = "ci/heavy.sh cargo build --release --locked -q -p transport-subject && oracles/h2-conformance/run --subject target/release/transport-subject"
selftest = "oracles/h2-conformance/run --self-test"
remote = true

[[gate]]
name = "systemd-hardening"
cmd = "s=$(systemd-analyze security --offline=yes deploy/aegis-hardened.service 2>&1 | grep -oE 'Overall exposure level for .*: [0-9.]+' | grep -oE '[0-9.]+$'); echo exposure=$s; python3 -c \"import sys; sys.exit(0 if float('$s') <= 2.0 else 1)\""

[[gate]]
name = "kani-tbi"
cmd = "ci/kani.sh"
selftest = "ci/kani.sh --self-test"
heavy = true

[[gate]]
name = "transport-limits"
cmd = "oracles/transport-limits/run --subject target/release/transport-subject"
selftest = "oracles/transport-limits/run --self-test target/release/transport-subject"
heavy = true

# OPEN (not yet a gate): perf-w1 vs nginx (provisional on laptop).
[[gate]]
name = "reverse-proxy-e2e"
cmd = "ci/heavy.sh cargo build --release --locked -q -p aegis-bin && CARGO_TARGET_DIR=target/e2e-mutants ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features e2e-mutants && oracles/proxy-e2e/run --subject target/release/aegis"
selftest = "oracles/proxy-e2e/run --self-test"
remote = true


[[gate]]
name = "mcp-gateway"
# Launches target/release/aegis with the oracle gateway profile (agent listener -> oracle mock upstream) and runs the
# full corpus against it, including the needs-* cases. Defined by P3-agent-001's subject wiring.
cmd = "ci/heavy.sh cargo build --release --locked -q -p aegis-bin -p aegis-pdp && ci/mcp-gate.sh run --flood-n 20000"
selftest = "oracles/mcp-corpus/run --self-test && ci/mcp-gate.sh self-test"
remote = true

[[gate]]
name = "no-cedar-in-bin"
cmd = "! cargo tree --locked -e normal,build -p aegis-bin --prefix none | grep -q '^cedar-policy'"
selftest = "cargo tree --locked -e normal,build -p aegis-pdp --prefix none | grep -q '^cedar-policy'"

[[gate]]
name = "fuzz"
cmd = "ci/fuzz.sh run --execs 100000000"
selftest = "ci/fuzz.sh self-test"
heavy = true
remote = true

# ======================================================================== Phase 4 additions

[[gate]]
name = "lowering-read-sqlite"
cmd = "ci/heavy.sh cargo build --release --locked -q -p sqlite-subject && ci/heavy.sh oracles/lowering-read/run --big --engine-pin --subject 'target/release/sqlite-subject lowering'"
selftest = "oracles/lowering-read/run --self-test && oracles/lowering-read/run --self-test --subject 'target/release/sqlite-subject lowering'"
heavy = true
remote = true

[[gate]]
name = "lowering-read-pg"
cmd = "ci/heavy.sh cargo build --release --locked -q -p pg-subject && ci/engines.sh with pg17,pg18 -- ci/heavy.sh oracles/lowering-read/run --big --skip-sqlite --engine-pin --subject 'target/release/pg-subject lowering' --engine pg --dsn @pg17 --engine pg --dsn @pg18"
selftest = "ci/engines.sh with pg17 -- oracles/lowering-read/run --self-test --skip-sqlite --subject 'target/release/pg-subject lowering' --engine pg --dsn @pg17"
heavy = true

[[gate]]
name = "lowering-read-redis"
cmd = "ci/heavy.sh cargo build --release --locked -q -p redis-subject && ci/engines.sh with valkey,redis -- ci/heavy.sh oracles/lowering-read/run --big --skip-sqlite --engine-pin --subject 'target/release/redis-subject lowering' --engine redis --url @valkey --engine redis --url @redis"
selftest = "ci/engines.sh with valkey -- oracles/lowering-read/run --self-test --skip-sqlite --subject 'target/release/redis-subject lowering' --engine redis --url @valkey"
heavy = true

[[gate]]
name = "lowering-write-sqlite"
cmd = "ci/heavy.sh cargo build --release --locked -q -p sqlite-subject && oracles/lowering-write/run --n 300 --engine-pin --subject 'target/release/sqlite-subject lowering'"
selftest = "oracles/lowering-write/run --self-test && oracles/lowering-write/run --self-test --subject 'target/release/sqlite-subject lowering'"
remote = true

[[gate]]
name = "lowering-write-pg"
cmd = "ci/heavy.sh cargo build --release --locked -q -p pg-subject && ci/engines.sh with pg17,pg18 -- oracles/lowering-write/run --n 300 --skip-sqlite --engine-pin --subject 'target/release/pg-subject lowering' --engine pg --dsn @pg17 --engine pg --dsn @pg18"
selftest = "ci/engines.sh with pg17 -- oracles/lowering-write/run --self-test --skip-sqlite --subject 'target/release/pg-subject lowering' --engine pg --dsn @pg17"
heavy = true

[[gate]]
name = "lowering-write-redis"
# includes the kv_acl hostile-command corpus (RENAME, COPY, SORT ... STORE, EVAL, MOVE, SWAPDB, FLUSH*, KEYS)
cmd = "ci/heavy.sh cargo build --release --locked -q -p redis-subject && ci/engines.sh with valkey,redis -- oracles/lowering-write/run --n 300 --skip-sqlite --engine-pin --subject 'target/release/redis-subject lowering' --engine redis --url @valkey --engine redis --url @redis"
selftest = "ci/engines.sh with valkey -- oracles/lowering-write/run --self-test --skip-sqlite --subject 'target/release/redis-subject lowering' --engine redis --url @valkey"
heavy = true

[[gate]]
name = "schema-gate-static"
cmd = "ci/heavy.sh cargo build --release --locked -q -p datair-subject && oracles/schema-gate/run --static --subject 'target/release/datair-subject schema'"
selftest = "oracles/schema-gate/run --self-test --static"
remote = true

[[gate]]
name = "schema-gate-sqlite"
cmd = "ci/heavy.sh cargo build --release --locked -q -p sqlite-subject && oracles/schema-gate/run --engine sqlite --subject 'target/release/sqlite-subject schema'"
selftest = "oracles/schema-gate/run --self-test --engine sqlite"
remote = true

[[gate]]
name = "schema-gate-pg"
cmd = "ci/heavy.sh cargo build --release --locked -q -p pg-subject && ci/engines.sh with pg17,pg18 -- sh -c \"oracles/schema-gate/run --engine pg --dsn @pg17 --subject 'target/release/pg-subject schema' && oracles/schema-gate/run --engine pg --dsn @pg18 --subject 'target/release/pg-subject schema'\""
selftest = "ci/engines.sh with pg17 -- oracles/schema-gate/run --self-test --engine pg --dsn @pg17"
heavy = true

[[gate]]
name = "nonempty-props"
cmd = "ci/heavy.sh cargo build --release --locked -q -p host-subject && oracles/nonempty-props/run --cases 100000 --subject 'target/release/host-subject nonempty'"
selftest = "oracles/nonempty-props/run --self-test && oracles/nonempty-props/run --self-test --subject 'target/release/host-subject nonempty'"
remote = true

[[gate]]
name = "unrestricted-ledger"
cmd = "ci/heavy.sh cargo build --release --locked -q -p aegis-bin && python3 -I ci/unrestricted.py check"
selftest = "python3 -I ci/unrestricted.py --self-test"
remote = true

[[gate]]
name = "allowlist-lock"
cmd = "cargo xtask allowlist-lock --check"
selftest = "cargo xtask allowlist-lock --self-test"

[[gate]]
name = "cancel-sweep"
cmd = "ci/heavy.sh cargo build --release --locked -q -p cancel-subject && oracles/cancel-sweep/run --seeds 200 --subject target/release/cancel-subject"
selftest = "oracles/cancel-sweep/run --self-test && oracles/cancel-sweep/run --self-test --subject target/release/cancel-subject"
heavy = true
remote = true

[[gate]]
name = "crs-tls"
# nginx CVE-2025-23419 replica (cross-vhost / cross-epoch / cross-ALPN resumption). Needs the host openssl client.
cmd = "ci/heavy.sh cargo build --release --locked -q -p aegis-bin && oracles/crs-diff/run --family tls-resume --subject target/release/aegis"
selftest = "oracles/crs-diff/run --self-test --family tls-resume"

[[gate]]
name = "crs-data"
cmd = "ci/heavy.sh cargo build --release --locked -q -p crs-subject && ci/engines.sh with pg17,valkey -- oracles/crs-diff/run --family data --subject target/release/crs-subject --pg @pg17 --redis @valkey"
selftest = "oracles/crs-diff/run --self-test --family data"
heavy = true

[[gate]]
name = "sdk-trybuild"
cmd = "ci/heavy.sh oracles/sdk-trybuild/run"
selftest = "ci/heavy.sh oracles/sdk-trybuild/run --self-test"
heavy = true
remote = true

[[gate]]
name = "sdk-host"
cmd = "ci/heavy.sh cargo build --release --locked -q -p host-subject && oracles/sdk-host/run --subject 'target/release/host-subject sdk-host'"
selftest = "oracles/sdk-host/run --self-test && oracles/sdk-host/run --self-test --subject 'target/release/host-subject sdk-host'"
remote = true

[[gate]]
name = "crash-harness"
# full size (~170k images: main + fsync EIO + double fault); subject built with libc-routed I/O for the tracer
cmd = "CARGO_TARGET_DIR=target/crash RUSTFLAGS='--cfg rustix_use_libc' ci/heavy.sh cargo build --release --locked -q -p crash-subject && HEAVY_TIMEOUT=7200 oracles/crash-harness/run --full --jobs 8 --subject 'target/crash/release/crash-subject {dir}'"
selftest = "oracles/crash-harness/run --self-test && oracles/crash-harness/run --self-test --subject 'target/crash/release/crash-subject {dir}'"
heavy = true
remote = true

[[gate]]
name = "state-props"
cmd = "ci/heavy.sh cargo build --release --locked -q -p state-subject && oracles/state-props/run --subject 'target/release/state-subject {dir}'"
selftest = "oracles/state-props/run --self-test && oracles/state-props/run --self-test --subject 'target/release/state-subject {dir}'"
remote = true

[[gate]]
name = "pg-version-floor"
# fake PG v3 server over a version matrix; floors come from supply-chain/engine-pins.toml
cmd = "ci/heavy.sh cargo build --release --locked -q -p pg-subject && oracles/pg-version-gate/run --subject 'target/release/pg-subject connect'"
selftest = "oracles/pg-version-gate/run --self-test"
remote = true

[[gate]]
name = "pg19-blocked"
# live: postgres:19rc1 refused, postgres:17-alpine accepted. Lift only by a spec change naming the fixed minor AND a
# passing lowering-write RLS ON CONFLICT family on that image.
cmd = "ci/heavy.sh cargo build --release --locked -q -p pg-subject && ci/engines.sh with pg19rc1,pg17 -- oracles/pg-version-gate/run --live --subject 'target/release/pg-subject connect' --refuse @pg19rc1 --accept @pg17"
selftest = "ci/engines.sh with pg19rc1,pg17 -- oracles/pg-version-gate/run --self-test --live --refuse @pg19rc1 --accept @pg17"
heavy = true

[[gate]]
name = "no-pg-query-in-bin"
cmd = "ci/no-crate.sh aegis-bin pg_query libpg_query pg_query_sys"
selftest = "ci/no-crate.sh --self-test"

[[gate]]
name = "native-e2e"
cmd = "ci/heavy.sh cargo build --release --locked -q -p aegis-bin && CARGO_TARGET_DIR=target/e2e-mutants ci/heavy.sh cargo build --release --locked -q -p aegis-bin --features e2e-mutants && ci/engines.sh with pg17 -- oracles/native-e2e/run --subject target/release/aegis --pg @pg17"
selftest = "oracles/native-e2e/run --self-test && oracles/native-e2e/run --self-test --subject target/release/aegis"
heavy = true
