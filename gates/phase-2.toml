# Phase 2 go/no-go: reverse-proxy mode "R" (IMPLEMENTATION_PLAN §3 Phase 2). Run: python3 -I ci/run-gates.py --phase 2
# Carries the Phase-0 gates (vet becomes the frozen-baseline ratchet, supply-chain/POLICY.md) and adds each unit's
# oracle against the real Rust subject. Gates marked TODO are defined but not yet satisfiable; they fail until built.
phase = 2
go_no_go = "all gates pass && all self-tests pass"

[[gate]]
name = "workflow-lint"
cmd = "zizmor --pedantic --offline .github/"
selftest = "! zizmor --pedantic --offline ci/fixtures/bad-workflow.yml"

[[gate]]
name = "hygiene"
cmd = "cargo fmt --all --check && ci/heavy.sh cargo clippy --workspace --all-targets --locked -q -- -D warnings"

[[gate]]
name = "tests"
cmd = "ci/heavy.sh cargo test --workspace --all-targets --locked -q"

[[gate]]
name = "layering"
cmd = "cargo xtask layering"
selftest = "cargo xtask layering --self-test"

[[gate]]
name = "interfaces-frozen"
cmd = "python3 -I ci/interfaces.py check"
selftest = "python3 -I ci/interfaces.py self-test"

[[gate]]
name = "proof"
cmd = "ci/heavy.sh ci/gate.sh"
selftest = "ci/gate-selftest.sh"
heavy = true

[[gate]]
name = "deny"
cmd = "cargo deny check"
selftest = "ci/deny-selftest.sh"

[[gate]]
name = "audit"
cmd = "cargo audit --deny warnings"

[[gate]]
name = "vet"
cmd = "cargo vet --locked && python3 -I ci/vet-baseline.py"
selftest = "python3 -I ci/vet-baseline.py --self-test"

[[gate]]
name = "repo-advisories"
cmd = "cargo xtask repo-advisories"
selftest = "cargo xtask repo-advisories --self-test"

[[gate]]
name = "lock-age"
cmd = "cargo xtask lock-age --min-days 7"
selftest = "cargo xtask lock-age --self-test"

[[gate]]
name = "lock-targets"
cmd = "cargo xtask lock-targets"
selftest = "cargo xtask lock-targets --self-test"

[[gate]]
name = "repro"
cmd = "ci/repro.sh"
selftest = "ci/repro.sh --self-test"
heavy = true

[[gate]]
name = "fail-closed-boot"
cmd = "ci/heavy.sh cargo build --locked -q -p aegis-bin && { target/debug/aegis; test $? -eq 78; }"

[[gate]]
name = "oracles"
cmd = "ci/oracles.sh run"
selftest = "ci/oracles.sh self-test"
heavy = true

[[gate]]
name = "build-subjects"
cmd = "ci/heavy.sh cargo build --release --locked -p admission-subject -p canon-subject -p tls-subject -p audit-subject -p upgrade-subject -p acme-subject"

[[gate]]
name = "admission-props"
cmd = "ci/heavy.sh oracles/admission-props/run --subject target/release/admission-subject"
selftest = "ci/heavy.sh oracles/admission-props/run --self-test"

[[gate]]
name = "canon-diff"
cmd = "oracles/canon-diff/run --subject target/release/canon-subject"
selftest = "oracles/canon-diff/run --self-test"

[[gate]]
name = "tls-verdicts"
cmd = "ci/heavy.sh oracles/hrr-verdicts/run --file tls/verdicts.toml --subject 'target/release/tls-subject subject'"
selftest = "ci/heavy.sh oracles/hrr-verdicts/run --self-test"

[[gate]]
name = "audit-tlog"
cmd = "oracles/tlog-verify/run --subject target/release/audit-subject"
selftest = "oracles/tlog-verify/run --self-test"

[[gate]]
name = "upgrade"
cmd = "oracles/upgrade-harness/run --subject target/release/upgrade-subject --reloads 100 --listeners 4"
selftest = "oracles/upgrade-harness/run --self-test"
heavy = true

[[gate]]
name = "acme-cert"
cmd = "oracles/acme-pebble/run --subject target/release/acme-subject"
selftest = "oracles/acme-pebble/run --self-test"
heavy = true

[[gate]]
name = "metrics"
cmd = "cargo xtask metrics-check"
selftest = "cargo xtask metrics-check --self-test"

[[gate]]
name = "budget"
cmd = "cargo xtask budget"
selftest = "cargo xtask budget --self-test"

[[gate]]
name = "config-totality"
cmd = "AEGIS_CONFIG_ITERS=1000000 ci/heavy.sh cargo test --release --locked -q -p aegis-config"

# TODO (transport / proxy units): h2spec 100%, resource-ratio fuzz corpus, stall DST, Kani TBI on the prover box,
# systemd-analyze security ≤2, perf-w1 (provisional on laptop), end-to-end reverse-proxy smoke.
[[gate]]
name = "reverse-proxy-e2e"
cmd = "test -x oracles/proxy-e2e/run && oracles/proxy-e2e/run --subject target/release/aegis"
selftest = "test -x oracles/proxy-e2e/run && oracles/proxy-e2e/run --self-test"
