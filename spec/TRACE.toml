# AEGIS traceability map, C4 (P8-conformance-001; PREFLIGHT D-P8.5; ARCHITECTURE R-ASSURE-2 C4).
#
# Every F1 statement id in spec/STATEMENTS.sha256 (the frozen Lean declaration ledger) has exactly one row here,
# naming >= 1 gate id of the current gates/phase-N.toml whose passing logs in a run are the evidence for it.
# conformance/run --require C4 refuses (C4 red) when: a ledger id has no row; a row names an id not in the ledger;
# a row is empty or names something that is not a gate (or an embedded member `gate[oracle]` the runner knows);
# a named gate runs at or after the conformance gate (its log could never be from this run); `ledger_sha256` is not
# the sha256 of spec/STATEMENTS.sha256 (a re-frozen ledger needs this map reviewed in the same change); or any
# named gate lacks a fresh `[exit 0]` cmd log and selftest log from this run.
#
# Gate meaning: `proof` = ci/gate.sh (lake build, no sorry, axiom allowlist, lake check --paranoid with five
# independent checkers, statement hashes unchanged): the statement holds of the Lean MODEL (rung R4 for theorems;
# for def/structure/inductive rows it is the definition the theorems are about). A DRT gate = the Rust code was
# differentially tested against that model (R2 correspondence). Neither makes the Rust code proven.
# The prose invariants of spec/SPEC_INVARIANTS.md carry their own gate names and rungs; they are not traced here.

v = 1
ledger = "spec/STATEMENTS.sha256"
ledger_sha256 = "3348552e67c54a86bb8da8c453e30b87dff9e9e3d356422a94411f64da34ff14"

[trace]

# --- AegisIR.Combine: INV-FAILCLOSED (F3). proof: the Lean statements (R4, model). oracles-remote[pdp-dst]: the Rust PDP host mapping
# (timeout/crash/garbage -> Error -> combine -> Deny) against the same expectations, R2 on the Rust client path; it
# does not execute the Lean model.
"AegisIR.Combine:AegisIR.Combine.Decision" = ["proof", "oracles-remote[pdp-dst]"]
"AegisIR.Combine:AegisIR.Combine.combine" = ["proof", "oracles-remote[pdp-dst]"]
"AegisIR.Combine:AegisIR.Combine.combine_allow_iff" = ["proof", "oracles-remote[pdp-dst]"]
"AegisIR.Combine:AegisIR.Combine.combine_empty" = ["proof", "oracles-remote[pdp-dst]"]
