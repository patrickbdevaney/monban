[package]
name = "monban-crash-refstore"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "refstore"
path = "src/main.rs"

[dependencies]
# Golden floor: SQLite >= 3.54.0 (3.51.3 WAL-reset corruption; 3.54.0 CVE-2026-119375 / RUSTSEC-2026-0459).
# rusqlite 0.41.1 (2026-10-28) -> libsqlite3-sys 0.39.1 (2026-10-25), which bundles SQLite 3.54.1 (was 0.40.2 /
# 0.38.2 / 3.53.2 at the 2026-10-25 port). The binary asserts the runtime version >= 3.54.0 at startup.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
redb = "=4.4.0"
