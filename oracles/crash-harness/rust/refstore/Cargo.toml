[package]
name = "aegis-crash-refstore"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "refstore"
path = "src/main.rs"

[dependencies]
# Golden floor: SQLite >= 3.51.3. rusqlite 0.41.0 (libsqlite3-sys 0.39.x) was published 2026-10-24, < 7 days
# before the port (2026-10-25), so the previous release is pinned: rusqlite 0.40.2 -> libsqlite3-sys 0.38.2,
# which bundles SQLite 3.53.2. The binary asserts the runtime version >= 3.51.3 at startup.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
redb = "=4.4.0"
