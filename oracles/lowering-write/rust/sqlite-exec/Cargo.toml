[package]
name = "aegis-lowering-sqlite-exec"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sqlite-exec"
path = "src/main.rs"

[dependencies]
# The adapter pin (supply-chain/engine-pins.toml [sqlite] version = "3.53.2"): rusqlite =0.40.2 bundled ->
# libsqlite3-sys 0.38.2 -> SQLite 3.53.2, the same pin as oracles/crash-harness/rust/refstore and the adapter.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
