[package]
name = "aegis-lowering-sqlite-exec"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sqlite-exec"
path = "src/main.rs"

[dependencies]
# The adapter pin (supply-chain/engine-pins.toml [sqlite] version = "3.54.1"): rusqlite =0.41.1 bundled ->
# libsqlite3-sys 0.39.1 -> SQLite 3.54.1, the same pin as oracles/crash-harness/rust/refstore and the adapter.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
